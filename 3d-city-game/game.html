<body>
<div id="loading"><div>🏙️ Shehar load ho raha hai...</div><div id="loadingBarOuter"><div id="loadingBarInner"></div></div><div id="loadingText">0 / 0</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
// ============================================================
//  ASSET PATHS  (models yahi folder-structure mein rakho)
//  Isi wajah se ye file chhoti/editable rehti hai - models
//  alag files hain, HTML sirf unka RELATIVE PATH use karta hai.
// ============================================================
const MODELS = {
  buildings: [
    'models/city/Big Building.glb',
    'models/city/Brown Building.glb',
    'models/city/Building Green.glb',
    'models/city/Building Red.glb',
    'models/city/Building Red Corner.glb'
  ],
  tree: 'models/city/Tree.glb',
  props: [
    'models/city/Bench.glb',
    'models/city/Fire hydrant.glb',
    'models/city/Trash Can.glb',
    'models/city/Traffic Light.glb'
  ],
  cars: [
    'models/cars/Car.glb',
    'models/cars/SUV.glb',
    'models/cars/Taxi.glb',
    'models/cars/Police Car.glb',
    'models/cars/Sports Car.glb',
    'models/cars/Sports Car-1mkmFkAz5v.glb'
  ],
  men: [
    'models/men/Adventurer.glb',
    'models/men/Farmer.glb',
    'models/men/Business Man.glb',
    'models/men/Casual Character.glb',
    'models/men/Worker.glb',
    'models/men/Punk.glb',
    'models/men/Hoodie Character.glb'
  ],
  player: 'models/men/Adventurer.glb'
};

// Agar koi model ulta/tirchha dikhe to bas ye offsets (radians) badal dena.
const CAR_FACING_OFFSET = Math.PI / 2;    // car models usually Z-forward -> game needs X-forward (flipped, was -PI/2)
const CHAR_FACING_OFFSET = 0;             // character models usually already Z-forward like game needs

// ---------- Basic setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 150, 550);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x444422, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

// ---------- Procedural textures (canvas-based, no extra downloads needed) ----------
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0,0,128,128);
  for (let i=0;i<900;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#43a047' : '#66bb6a';
    ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(50, 50);
  return tex;
}
function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0,0,64,64);
  for (let i=0;i<250;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#333333' : '#454545';
    ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeDashTextureH() { // dashes running along the texture's U (horizontal) axis
  const c = document.createElement('canvas'); c.width = 64; c.height = 16;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(4, 6, 28, 4);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
function makeDashTextureV() { // dashes running along the texture's V (vertical) axis
  const c = document.createElement('canvas'); c.width = 16; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(6, 4, 4, 28);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const grassTexture = makeGrassTexture();
const asphaltTexture = makeAsphaltTexture();
const dashTextureH = makeDashTextureH();
const dashTextureV = makeDashTextureV();

// ---------- Ground (grass + road) ----------
const groundGeo = new THREE.PlaneGeometry(400, 400);
const groundMat = new THREE.MeshStandardMaterial({ map: grassTexture });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Roads (cross pattern) - asphalt texture + a dashed center lane line
function makeRoad(w, h, x, z) {
  const roadTex = asphaltTexture.clone();
  roadTex.needsUpdate = true;
  roadTex.repeat.set(w / 6, h / 6);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({ map: roadTex }));
  road.rotation.x = -Math.PI/2;
  road.position.set(x, 0.01, z);
  road.receiveShadow = true;
  scene.add(road);

  // center dashed lane line, oriented along whichever axis the road runs
  const horizontal = w > h;
  const dashTex = (horizontal ? dashTextureH : dashTextureV).clone();
  dashTex.needsUpdate = true;
  const lineW = horizontal ? w : 0.5;
  const lineH = horizontal ? 0.5 : h;
  if (horizontal) dashTex.repeat.set(w / 8, 1); else dashTex.repeat.set(1, h / 8);
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(lineW, lineH),
    new THREE.MeshStandardMaterial({ map: dashTex, transparent: true, depthWrite: false })
  );
  line.rotation.x = -Math.PI/2;
  line.position.set(x, 0.02, z);
  scene.add(line);
}
makeRoad(400, 14, 0, 0);
makeRoad(14, 400, 0, 0);
makeRoad(400, 10, 0, 60);
makeRoad(400, 10, 0, -60);
makeRoad(10, 400, 60, 0);
makeRoad(10, 400, -60, 0);

// Shared helper: is this x/z point sitting on/too close to any road?
// (used by tree + prop scattering so nothing spawns in the middle of traffic)
function isNearRoad(x, z) {
  return Math.abs(x) < 10 || Math.abs(z) < 10 ||
         Math.abs(x - 60) < 8 || Math.abs(x + 60) < 8 ||
         Math.abs(z - 60) < 8 || Math.abs(z + 60) < 8;
}

// ---------- Collision obstacles list ----------
const obstacles = []; // { x, z, radius }

// ============================================================
//  MODEL LOADER + CACHE
//  Har GLB sirf EK BAAR load hota hai (cache me), fir jitni
//  chahiye utni clones bana lete hain - isse network/parse cost
//  bahut kam ho jaati hai.
// ============================================================
const gltfLoader = new THREE.GLTFLoader();
const modelCache = {};
let loadedCount = 0, totalCount = 0;
const loadingBar = document.getElementById('loadingBarInner');
const loadingText = document.getElementById('loadingText');

function updateLoadingUI() {
  const pct = totalCount ? Math.round((loadedCount/totalCount)*100) : 0;
  loadingBar.style.width = pct + '%';
  loadingText.textContent = `${loadedCount} / ${totalCount} models`;
}

async function loadModel(path) {
  if (modelCache[path]) return modelCache[path];
  totalCount++;
  updateLoadingUI();
  const gltf = await gltfLoader.loadAsync(encodeURI(path));
  // Fix: many free GLB packs leave metallicFactor unset -> defaults to 1 (fully metal).
  // Without an environment map, fully-metal surfaces get almost no light and render BLACK.
  // Forcing metalness to 0 makes them matte and correctly lit by our hemi/directional lights.
  gltf.scene.traverse(o => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.metalness !== undefined) m.metalness = 0; });
    }
  });
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const data = { gltf, size, center };
  modelCache[path] = data;
  loadedCount++;
  updateLoadingUI();
  return data;
}
function getModel(path) { return modelCache[path]; } // use only AFTER preload finishes

async function preloadAll() {
  const all = [
    ...MODELS.buildings, MODELS.tree, ...MODELS.props,
    ...MODELS.cars, ...MODELS.men, MODELS.player
  ];
  const unique = [...new Set(all)];
  await Promise.all(unique.map(loadModel));
}

// ---------- Static (non-animated) model instance helper ----------
// Buildings, trees, props, cars: simple clone, re-centered on X/Z,
// uniformly scaled so its height (or length) matches targetSize.
function makeStaticInstance(path, targetSize, axis = 'y') {
  const data = getModel(path);
  const inst = data.gltf.scene.clone(true);
  const scale = targetSize / data.size[axis];
  inst.scale.setScalar(scale);
  inst.position.set(-data.center.x * scale, 0, -data.center.z * scale);
  inst.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return { inst, scaledSize: { x: data.size.x * scale, y: data.size.y * scale, z: data.size.z * scale } };
}

// ---------- City buildings ----------
function spawnBuilding(x, z) {
  const path = MODELS.buildings[Math.floor(Math.random() * MODELS.buildings.length)];
  const targetHeight = 12 + Math.random() * 40;
  const { inst, scaledSize } = makeStaticInstance(path, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.floor(Math.random() * 4) * (Math.PI / 2);
  scene.add(wrapper);
  const radius = Math.sqrt(scaledSize.x * scaledSize.x + scaledSize.z * scaledSize.z) / 2;
  obstacles.push({ x, z, radius });
}

const cityBlocks = [
  [-100,-100],[-100,100],[100,-100],[100,100],
  [-140,-30],[-140,30],[140,-30],[140,30],
  [-30,-140],[30,-140],[-30,140],[30,140]
];
function buildCity() {
  cityBlocks.forEach(([bx,bz]) => {
    for(let i=0;i<3;i++){
      const ox = bx + (Math.random()-0.5)*20;
      const oz = bz + (Math.random()-0.5)*20;
      spawnBuilding(ox, oz);
    }
  });
}

// ---------- Nature: trees ----------
function spawnTree(x, z) {
  const targetHeight = 5 + Math.random() * 2.5;
  const { inst } = makeStaticInstance(MODELS.tree, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.random() * Math.PI * 2;
  scene.add(wrapper);
  obstacles.push({ x, z, radius: 0.9 }); // trunk collision, keep small so it feels natural
}
function scatterTrees() {
  for (let i=0;i<60;i++){
    let x = (Math.random()-0.5)*350;
    let z = (Math.random()-0.5)*350;
    if (isNearRoad(x, z)) continue;
    spawnTree(x, z);
  }
}

// ---------- Street props (bench / fire hydrant / trash can / traffic light) ----------
function spawnProp(path, x, z, targetHeight, collisionRadius) {
  const { inst } = makeStaticInstance(path, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.random() * Math.PI * 2;
  scene.add(wrapper);
  if (collisionRadius) obstacles.push({ x, z, radius: collisionRadius });
}
function scatterProps() {
  const corners = [[10,10],[10,-10],[-10,10],[-10,-10],[70,10],[70,-10],[-70,10],[-70,-10]];
  corners.forEach(([x,z]) => spawnProp('models/city/Traffic Light.glb', x, z, 4.5, 0.5));
  for (let i=0;i<25;i++){
    let x = (Math.random()-0.5)*340;
    let z = (Math.random()-0.5)*340;
    if (isNearRoad(x, z)) continue;
    const kind = Math.random();
    if (kind < 0.4) spawnProp('models/city/Bench.glb', x, z, 1.1, 1.2);
    else if (kind < 0.7) spawnProp('models/city/Trash Can.glb', x, z, 1.0, 0.5);
    else spawnProp('models/city/Fire hydrant.glb', x, z, 0.7, 0.4);
  }
}

// ---------- Player's home (place to live, kept simple/procedural) ----------
function buildHome() {
  const home = new THREE.Group();
  const baseHouse = new THREE.Mesh(
    new THREE.BoxGeometry(8, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0xE0C097 })
  );
  baseHouse.position.y = 2.5;
  baseHouse.castShadow = true;
  baseHouse.receiveShadow = true;
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(6.5, 3.5, 4),
    new THREE.MeshStandardMaterial({ color: 0xB0402A })
  );
  roof.position.y = 6.75;
  roof.rotation.y = Math.PI/4;
  roof.castShadow = true;
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 3, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x5D4037 })
  );
  door.position.set(0, 1.5, 4.05);
  home.add(baseHouse, roof, door);
  home.position.set(20, 0, 20);
  scene.add(home);
  obstacles.push({ x: 20, z: 20, radius: 6.2 });

  const yardGeo = new THREE.RingGeometry(9, 9.4, 32);
  const yard = new THREE.Mesh(yardGeo, new THREE.MeshStandardMaterial({ color:0xffeb3b, side:THREE.DoubleSide }));
  yard.rotation.x = -Math.PI/2;
  yard.position.set(20, 0.02, 20);
  scene.add(yard);
}

// ============================================================
//  CHARACTERS (player + NPCs) - skinned GLB with animations
// ============================================================
function findClip(clips, wanted) {
  return clips.find(c => c.name.toLowerCase().includes(wanted.toLowerCase())) || clips[0];
}

function spawnCharacter(path, targetHeight) {
  const data = getModel(path);
  const clone = THREE.SkeletonUtils.clone(data.gltf.scene);
  const scale = targetHeight / data.size.y;
  clone.scale.setScalar(scale);
  clone.position.set(-data.center.x * scale, 0, -data.center.z * scale);
  clone.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  const orientFix = new THREE.Group();
  orientFix.rotation.y = CHAR_FACING_OFFSET;
  orientFix.add(clone);

  const root = new THREE.Group();
  root.add(orientFix);

  const mixer = new THREE.AnimationMixer(clone);
  const clips = data.gltf.animations;
  const idleAction = mixer.clipAction(findClip(clips, 'Idle_Neutral') || findClip(clips, 'Idle'));
  const walkAction = mixer.clipAction(findClip(clips, 'Walk'));
  walkAction.timeScale = WALK_ANIM_SPEED; // slower leg-swing to match the walking speed (tweak WALK_ANIM_SPEED above)
  idleAction.play();

  return { group: root, mixer, idleAction, walkAction, current: idleAction };
}

function setWalking(person, moving) {
  const target = moving ? person.walkAction : person.idleAction;
  if (person.current !== target) {
    target.reset().fadeIn(0.25).play();
    person.current.fadeOut(0.25);
    person.current = target;
  }
}

// ---------- Player character ----------
let player;
function buildPlayer() {
  player = spawnCharacter(MODELS.player, 1.9);
  player.group.position.set(20, 0, 30); // start near home
  scene.add(player.group);
}

// ---------- Controls ----------
const keys = { forward:false, backward:false, left:false, right:false };

window.addEventListener('keydown', (e) => {
  switch(e.key.toLowerCase()){
    case 'w': case 'arrowup': keys.forward = true; break;
    case 's': case 'arrowdown': keys.backward = true; break;
    case 'a': case 'arrowleft': keys.left = true; break;
    case 'd': case 'arrowright': keys.right = true; break;
  }
});
window.addEventListener('keyup', (e) => {
  switch(e.key.toLowerCase()){
    case 'w': case 'arrowup': keys.forward = false; break;
    case 's': case 'arrowdown': keys.backward = false; break;
    case 'a': case 'arrowleft': keys.left = false; break;
    case 'd': case 'arrowright': keys.right = false; break;
  }
});

// Mobile joystick
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyActive = false, joyStart = {x:0,y:0}, joyVec = {x:0,y:0};

joystick.addEventListener('touchstart', (e) => {
  joyActive = true;
  const t = e.touches[0];
  joyStart = { x: t.clientX, y: t.clientY };
  e.stopPropagation();
});
joystick.addEventListener('touchmove', (e) => {
  if(!joyActive) return;
  const t = e.touches[0];
  let dx = t.clientX - joyStart.x;
  let dy = t.clientY - joyStart.y;
  const max = 75;
  const len = Math.sqrt(dx*dx+dy*dy);
  if(len > max){ dx = dx/len*max; dy = dy/len*max; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec = { x: dx/max, y: dy/max };
  e.preventDefault();
  e.stopPropagation();
}, {passive:false});
joystick.addEventListener('touchend', (e) => {
  joyActive = false;
  joyVec = {x:0,y:0};
  stick.style.transform = 'translate(0px,0px)';
  e.stopPropagation();
});

// ---------- Camera look-around by dragging anywhere else on screen ----------
let camYawOffset = 0;
let camPitchOffset = 0;
let lookActive = false;
let lookStart = { x:0, y:0 };

renderer.domElement.addEventListener('touchstart', (e) => {
  lookActive = true;
  const t = e.touches[0];
  lookStart = { x: t.clientX, y: t.clientY };
});
renderer.domElement.addEventListener('touchmove', (e) => {
  if(!lookActive) return;
  const t = e.touches[0];
  const dx = t.clientX - lookStart.x;
  const dy = t.clientY - lookStart.y;
  const sensitivity = 0.005;
  camYawOffset -= dx * sensitivity;
  camPitchOffset = THREE.MathUtils.clamp(camPitchOffset - dy * sensitivity, -0.35, 0.6);
  lookStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, {passive:false});
renderer.domElement.addEventListener('touchend', () => {
  lookActive = false;
});

// ---------- NPCs: pedestrians roaming the city ----------
const npcs = [];
function spawnNPC(x, z) {
  const path = MODELS.men[Math.floor(Math.random() * MODELS.men.length)];
  const person = spawnCharacter(path, 1.75 + Math.random()*0.3);
  person.group.position.set(x, 0, z);
  scene.add(person.group);
  setWalking(person, true); // NPCs wander constantly -> keep them in walk cycle
  npcs.push({
    person,
    angle: Math.random() * Math.PI * 2,
    speed: 1.3 + Math.random() * 1.2,
    timer: 2 + Math.random() * 3
  });
}
function spawnAllNPCs() {
  for (let i = 0; i < 20; i++) {
    let x = (Math.random() - 0.5) * 340;
    let z = (Math.random() - 0.5) * 340;
    spawnNPC(x, z);
  }
}

// ============================================================
//  CARS driving around the roads
// ============================================================
function makeCarMesh(path) {
  const targetLength = 4.3;
  const { inst } = makeStaticInstance(path, targetLength, 'z');
  const orientFix = new THREE.Group();
  orientFix.rotation.y = CAR_FACING_OFFSET;
  orientFix.add(inst);
  const carRoot = new THREE.Group();
  carRoot.add(orientFix);
  return carRoot;
}

const cars = [];
function spawnCar(axis, fixedCoord, laneOffset, speed) {
  const path = MODELS.cars[Math.floor(Math.random() * MODELS.cars.length)];
  const mesh = makeCarMesh(path);
  if (axis === 'x') {
    mesh.position.set(-190, 0, fixedCoord + laneOffset);
    mesh.rotation.y = speed > 0 ? 0 : Math.PI;
  } else {
    mesh.position.set(fixedCoord + laneOffset, 0, -190);
    mesh.rotation.y = speed > 0 ? -Math.PI / 2 : Math.PI / 2;
  }
  scene.add(mesh);
  cars.push({ mesh, axis, speed });
}
function spawnAllCars() {
  [0, 60, -60].forEach(zc => {
    spawnCar('x', zc, 3, 9 + Math.random() * 5);
    spawnCar('x', zc, -3, -(9 + Math.random() * 5));
  });
  [0, 60, -60].forEach(xc => {
    spawnCar('z', xc, 3, 9 + Math.random() * 5);
    spawnCar('z', xc, -3, -(9 + Math.random() * 5));
  });
}

// ---------- Generic circle-collision helper ----------
function pushApart(posA, radiusA, posB, radiusB, moveA, moveB) {
  const dx = posA.x - posB.x;
  const dz = posA.z - posB.z;
  const distSq = dx*dx + dz*dz;
  const minDist = radiusA + radiusB;
  if (distSq < minDist * minDist) {
    const dist = Math.sqrt(distSq) || 0.001;
    const overlap = minDist - dist;
    const nx = dx / dist, nz = dz / dist;
    if (moveA && moveB) {
      posA.x += nx * overlap * 0.5; posA.z += nz * overlap * 0.5;
      posB.x -= nx * overlap * 0.5; posB.z -= nz * overlap * 0.5;
    } else if (moveA) {
      posA.x += nx * overlap; posA.z += nz * overlap;
    } else if (moveB) {
      posB.x -= nx * overlap; posB.z -= nz * overlap;
    }
    return true;
  }
  return false;
}

const PLAYER_RADIUS = 0.6;
const NPC_RADIUS = 0.55;
const CAR_RADIUS = 2.3; // circle approximation of the car's footprint

// ---------- Movement + camera follow ----------
let playerAngle = 0;
const moveSpeed = 6.5;   // units per second (was 12 - too fast for a walking human scale)
const turnSpeed = 2.8;
const WALK_ANIM_SPEED = 0.85; // tweak this if legs still look too fast/slow vs actual movement

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // combine keyboard + joystick input
  let turn = 0, move = 0;
  if(keys.left) turn += 1;
  if(keys.right) turn -= 1;
  if(keys.forward) move += 1;
  if(keys.backward) move -= 1;

  if (Math.abs(joyVec.x) > 0.1 || Math.abs(joyVec.y) > 0.1) {
    turn += -joyVec.x;
    move += -joyVec.y;
  }

  playerAngle += turn * turnSpeed * dt;
  player.group.rotation.y = playerAngle;

  let didMove = false;
  if (move !== 0) {
    const dir = new THREE.Vector3(Math.sin(playerAngle), 0, Math.cos(playerAngle));
    player.group.position.addScaledVector(dir, move * moveSpeed * dt);
    didMove = true;
  }

  setWalking(player, didMove);
  player.mixer.update(dt);

  // keep player within world bounds
  player.group.position.x = THREE.MathUtils.clamp(player.group.position.x, -190, 190);
  player.group.position.z = THREE.MathUtils.clamp(player.group.position.z, -190, 190);

  // ---- collision: push player out of any overlapping static obstacle (building/tree/home/prop) ----
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    pushApart(player.group.position, PLAYER_RADIUS, ob, ob.radius, true, false);
  }

  // ---- NPCs: wander around, avoid obstacles, play walk animation ----
  npcs.forEach(npc => {
    npc.timer -= dt;
    if (npc.timer <= 0) {
      npc.angle += (Math.random() - 0.5) * Math.PI;
      npc.timer = 2 + Math.random() * 3;
    }
    const dir = new THREE.Vector3(Math.sin(npc.angle), 0, Math.cos(npc.angle));
    npc.person.group.position.addScaledVector(dir, npc.speed * dt);
    npc.person.group.rotation.y = npc.angle;

    npc.person.group.position.x = THREE.MathUtils.clamp(npc.person.group.position.x, -190, 190);
    npc.person.group.position.z = THREE.MathUtils.clamp(npc.person.group.position.z, -190, 190);

    let bumped = false;
    const pos = npc.person.group.position;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (pushApart(pos, NPC_RADIUS, ob, ob.radius, true, false)) bumped = true;
    }
    if (bumped) {
      npc.angle += Math.PI + (Math.random() - 0.5); // turn around when hitting something
      npc.timer = 1 + Math.random() * 2;
    }

    npc.person.mixer.update(dt);
  });

  // ---- player vs NPCs: neither can walk through the other ----
  npcs.forEach(npc => {
    pushApart(player.group.position, PLAYER_RADIUS, npc.person.group.position, NPC_RADIUS, true, true);
  });

  // ---- NPCs vs each other: don't let pedestrians overlap/stack ----
  for (let i = 0; i < npcs.length; i++) {
    for (let j = i + 1; j < npcs.length; j++) {
      pushApart(npcs[i].person.group.position, NPC_RADIUS, npcs[j].person.group.position, NPC_RADIUS, true, true);
    }
  }

  // ---- Cars: drive along their lane and loop back around ----
  cars.forEach(c => {
    if (c.axis === 'x') {
      c.mesh.position.x += c.speed * dt;
      if (c.mesh.position.x > 200) c.mesh.position.x = -200;
      if (c.mesh.position.x < -200) c.mesh.position.x = 200;
    } else {
      c.mesh.position.z += c.speed * dt;
      if (c.mesh.position.z > 200) c.mesh.position.z = -200;
      if (c.mesh.position.z < -200) c.mesh.position.z = 200;
    }
  });

  // ---- cars vs player and cars vs NPCs: cars stay on their lane, everyone else gets pushed clear ----
  cars.forEach(c => {
    pushApart(player.group.position, PLAYER_RADIUS, c.mesh.position, CAR_RADIUS, true, false);
    npcs.forEach(npc => {
      pushApart(npc.person.group.position, NPC_RADIUS, c.mesh.position, CAR_RADIUS, true, false);
    });
  });

  // camera follow (third-person, behind player) + free-look offset from touch drag
  const camDist = 10;
  const totalYaw = playerAngle + camYawOffset;
  const camHeight = Math.max(3, 5 + camPitchOffset * 6);
  const camOffset = new THREE.Vector3(
    -Math.sin(totalYaw) * camDist,
    camHeight,
    -Math.cos(totalYaw) * camDist
  );
  const desiredCamPos = player.group.position.clone().add(camOffset);
  camera.position.lerp(desiredCamPos, 0.15);
  const lookTarget = player.group.position.clone().add(new THREE.Vector3(0, 1.5 + camPitchOffset * 2, 0));
  camera.lookAt(lookTarget);

  // Camera intentionally does NOT auto-recenter anymore - it stays exactly
  // where you rotate it. Drag on screen again anytime to adjust manually.

  renderer.render(scene, camera);
}

// ============================================================
//  INIT: preload every GLB once, THEN build the world (sync,
//  cheap clones) and finally start the render loop.
// ============================================================
async function init() {
  await preloadAll();

  buildHome();
  buildCity();
  scatterTrees();
  scatterProps();
  buildPlayer();
  spawnAllNPCs();
  spawnAllCars();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('info').style.display = 'block';
  document.getElementById('joystick').style.display = 'block';

  animate();
}
init();
</script>
