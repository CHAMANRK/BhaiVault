<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D City Explorer</title>
<style>
  html, body {

    padding:10px 14px; border-radius:8px; font-size:14px; z-index:10;
  }
  #joystick {
    position:absolute; bottom:60px; left:25px; width:220px; height:220px;
    border-radius:50%; background:rgba(255,255,255,0.15); touch-action:none; z-index:10;
  }
  #stick {

  .actionBtn {

    background:rgba(255,255,255,0.15); color:#fff; font-size:12px; font-weight:bold;

  #loadingBarOuter { width:260px; height:10px; background:#333; border-radius:6px; overflow:hidden; }

</style>
</head>
<body>
<div id="loading"><div>🏙️ Shehar load ho raha hai...</div><div id="loadingBarOuter"><div id="loadingBarInner"></div></div><div id="loadingText">0 / 0</div></div>
<div id="info" style="display:none">🎮 Move: <b>W A S D</b> ya <b>Arrow Keys</b><br>Run: <b>Shift</b> | Jump: <b>Space</b><br>Mobile: joystick + RUN/JUMP buttons se</div>
<div id="joystick" style="display:none"><div id="stick"></div></div>
<div id="actionButtons" style="display:none">
  <button id="jumpBtn" class="actionBtn">⤴<br>JUMP</button>
  <button id="runBtn" class="actionBtn">🏃<br>RUN</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
// ============================================================
//  ASSET PATHS  (models yahi folder-structure mein rakho)
//  Isi wajah se ye file chhoti/editable rehti hai - models
//  alag files hain, HTML sirf unka RELATIVE PATH use karta hai.
// ============================================================
const MODELS = {
  buildings: [
    'models/city/Big Building.glb',
    'models/city/Brown Building.glb',
    'models/city/Building Green.glb',
    'models/city/Building Red.glb',
    'models/city/Building Red Corner.glb'
  ],
  tree: 'models/city/Tree.glb',
  props: [
    'models/city/Bench.glb',
    'models/city/Fire hydrant.glb',
    'models/city/Trash Can.glb',
    'models/city/Traffic Light.glb'
  ],
  cars: [
    'models/cars/Car.glb',
    'models/cars/SUV.glb',
    'models/cars/Taxi.glb',
    'models/cars/Police Car.glb',
    'models/cars/Sports Car.glb',
    'models/cars/Sports Car-1mkmFkAz5v.glb'
  ],
  men: [
    'models/men/Adventurer.glb',
    'models/men/Farmer.glb',
    'models/men/Business Man.glb',
    'models/men/Casual Character.glb',
    'models/men/Worker.glb',
    'models/men/Punk.glb',
    'models/men/Hoodie Character.glb'
  ],
  player: 'models/men/Adventurer.glb'
};

// Agar koi model ulta/tirchha dikhe to bas ye offsets (radians) badal dena.
const CAR_FACING_OFFSET = Math.PI / 2;    // car models usually Z-forward -> game needs X-forward (flipped, was -PI/2)
const CHAR_FACING_OFFSET = 0;             // character models usually already Z-forward like game needs

// ---------- Basic setup ----------
const scene = new THREE.Scene();
const FOG_COLOR = 0xbfd9e8; // matches sky horizon band below, so fog blends invisibly into it
scene.fog = new THREE.Fog(FOG_COLOR, 220, 480); // matches CHUNK render/unload radius below - buildings fade out before they pop

const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1500);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; // softer shadow edges, cheap upgrade over default hard PCF
renderer.outputEncoding = THREE.sRGBEncoding;      // r128 API - correct gamma so colors don't wash out under tone mapping
renderer.toneMapping = THREE.ACESFilmicToneMapping; // filmic contrast curve - biggest single "looks premium" change
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ============================================================
//  DYNAMIC GRADIENT SKY - replaces the old flat scene.background
//  color. A big inverted sphere with a vertical gradient shader
//  (horizon -> zenith) plus a soft glow disc around the sun
//  direction. Cheap: one draw call, no extra textures/downloads.
// ============================================================
const skyUniforms = {
  topColor:    { value: new THREE.Color(0x4a90d9) }, // zenith blue
  bottomColor: { value: new THREE.Color(0xbfd9e8) }, // horizon haze (matches FOG_COLOR)
  offset:      { value: 20 },
  exponent:    { value: 0.6 },
  sunDirection:{ value: new THREE.Vector3(50, 80, 30).normalize() },
  sunColor:    { value: new THREE.Color(0xfff2cc) }
};
const skyGeo = new THREE.SphereGeometry(1400, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldPosition;
    void main() {
      vec4 worldPosition = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPosition.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform float offset;
    uniform float exponent;
    uniform vec3 sunDirection;
    uniform vec3 sunColor;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
      vec3 sky = mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0));
      float sunAmount = max(dot(normalize(vWorldPosition), normalize(sunDirection)), 0.0);
      vec3 glow = sunColor * pow(sunAmount, 16.0) * 0.6; // tight soft glow disc around sun direction
      gl_FragColor = vec4(sky + glow, 1.0);
    }
  `,
  side: THREE.BackSide,
  fog: false,
  depthWrite: false
});
const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0x9fc6e8, 0x4a3f2a, 1.0); // sky-blue from above / warm bounce from below, matches new gradient sky
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3d6, 1.3); // slightly warm sunlight, boosted for the filmic tone-mapped contrast curve
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

// ---------- Procedural textures (canvas-based, no extra downloads needed) ----------
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0,0,128,128);
  for (let i=0;i<900;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#43a047' : '#66bb6a';
    ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(50, 50);
  return tex;
}
function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0,0,64,64);
  for (let i=0;i<250;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#333333' : '#454545';
    ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeDashTextureH() { // dashes running along the texture's U (horizontal) axis
  const c = document.createElement('canvas'); c.width = 64; c.height = 16;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(4, 6, 28, 4);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}
function makeDashTextureV() { // dashes running along the texture's V (vertical) axis
  const c = document.createElement('canvas'); c.width = 16; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(6, 4, 4, 28);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// ============================================================
//  INFINITE WORLD GRID
//  Everything (roads, buildings, trees, props, NPCs, cars) is
//  keyed off one constant grid instead of hand-placed positions.
//  That's what actually lets the world extend forever instead of
//  stopping at a fixed 400x400 edge.
// ============================================================
const CHUNK_SIZE = 120;        // one city block, world units
const ROAD_WIDTH = 14;         // real road strip width now, not a texture guess
const BUILDING_MARGIN = 30;    // keep building CENTERS this far from a chunk edge, so a wide building's own footprint still clears the road
const RENDER_RADIUS = 3;       // chunks loaded around the player (3*120=360 units)
const UNLOAD_RADIUS = 4;       // hysteresis so chunks don't load/unload every frame at the boundary

// ---------- Ground: plain grass, one big plane (roads are separate meshes, added per-chunk below) ----------
function makeGrassTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4caf50'; ctx.fillRect(0,0,128,128);
  for (let i=0;i<900;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#43a047' : '#66bb6a';
    ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const WORLD_PLANE_SIZE = 4000; // generous fixed extent - fog/chunk-unload hide the true edge long before a player would reach it
const grassTexture = makeGrassTexture();
grassTexture.encoding = THREE.sRGBEncoding; // canvas colour textures need this set explicitly, unlike GLTF-loaded maps
grassTexture.repeat.set(WORLD_PLANE_SIZE / 8, WORLD_PLANE_SIZE / 8);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_PLANE_SIZE, WORLD_PLANE_SIZE),
  new THREE.MeshStandardMaterial({ map: grassTexture })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Road strip geometry/materials - created ONCE, shared by every chunk's
// road meshes (only .position differs). Same idea as the cached GLB clones: cheap
// to reuse, and because nothing here is per-chunk-unique, unloadChunk never has to
// dispose it - just scene.remove(), same as buildings/trees. ----------
function makeAsphaltTexture() {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0,0,64,64);
  for (let i=0;i<250;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#333333' : '#454545';
    ctx.fillRect(Math.random()*64, Math.random()*64, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
function makeDashTexture(horizontal) {
  const c = document.createElement('canvas');
  c.width = horizontal ? 64 : 16; c.height = horizontal ? 16 : 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  if (horizontal) ctx.fillRect(4, 6, 28, 4); else ctx.fillRect(6, 4, 4, 28);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = horizontal ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  tex.wrapT = horizontal ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  return tex;
}
const roadAsphaltH = makeAsphaltTexture(); roadAsphaltH.repeat.set(CHUNK_SIZE/6, ROAD_WIDTH/6); roadAsphaltH.encoding = THREE.sRGBEncoding;
const roadAsphaltV = makeAsphaltTexture(); roadAsphaltV.repeat.set(ROAD_WIDTH/6, CHUNK_SIZE/6); roadAsphaltV.encoding = THREE.sRGBEncoding;
const roadDashH = makeDashTexture(true);  roadDashH.repeat.set(CHUNK_SIZE/8, 1); roadDashH.encoding = THREE.sRGBEncoding;
const roadDashV = makeDashTexture(false); roadDashV.repeat.set(1, CHUNK_SIZE/8); roadDashV.encoding = THREE.sRGBEncoding;
const roadGeoH = new THREE.PlaneGeometry(CHUNK_SIZE, ROAD_WIDTH); // road running along X (fixed Z)
const roadGeoV = new THREE.PlaneGeometry(ROAD_WIDTH, CHUNK_SIZE); // road running along Z (fixed X)
const roadMatH = new THREE.MeshStandardMaterial({ map: roadAsphaltH });
const roadMatV = new THREE.MeshStandardMaterial({ map: roadAsphaltV });
const laneMatH = new THREE.MeshStandardMaterial({ map: roadDashH, transparent: true, depthWrite: false });
const laneMatV = new THREE.MeshStandardMaterial({ map: roadDashV, transparent: true, depthWrite: false });

// Shared helper: is this x/z point sitting on/too close to a road strip?
// Works anywhere in the infinite grid via modulo. Margin = full road width
// (not a fraction of it) so trees/props never clip into the actual asphalt.
function isNearRoad(x, z) {
  const margin = ROAD_WIDTH + 1;
  const mx = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  const mz = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  return mx < margin || mz < margin;
}

// ---------- Collision obstacles list ----------
// Each entry optionally carries a chunkKey so a whole chunk's obstacles
// can be removed in one pass when that chunk unloads.
const obstacles = []; // { x, z, radius, chunkKey }

// ============================================================
//  MODEL LOADER + CACHE
//  Har GLB sirf EK BAAR load hota hai (cache me), fir jitni
//  chahiye utni clones bana lete hain - isse network/parse cost
//  bahut kam ho jaati hai.
// ============================================================
const gltfLoader = new THREE.GLTFLoader();
const modelCache = {};
let loadedCount = 0, totalCount = 0;
const loadingBar = document.getElementById('loadingBarInner');
const loadingText = document.getElementById('loadingText');

function updateLoadingUI() {
  const pct = totalCount ? Math.round((loadedCount/totalCount)*100) : 0;
  loadingBar.style.width = pct + '%';
  loadingText.textContent = `${loadedCount} / ${totalCount} models`;
}

async function loadModel(path) {
  if (modelCache[path]) return modelCache[path];
  totalCount++;
  updateLoadingUI();
  const gltf = await gltfLoader.loadAsync(encodeURI(path));
  // Fix: many free GLB packs leave metallicFactor unset -> defaults to 1 (fully metal).
  // Without an environment map, fully-metal surfaces get almost no light and render BLACK.
  // Forcing metalness to 0 makes them matte and correctly lit by our hemi/directional lights.
  gltf.scene.traverse(o => {
    if (o.isMesh && o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m.metalness !== undefined) m.metalness = 0; });
    }
  });
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const data = { gltf, size, center };
  modelCache[path] = data;
  loadedCount++;
  updateLoadingUI();
  return data;
}
function getModel(path) { return modelCache[path]; } // use only AFTER preload finishes

async function preloadAll() {
  const all = [
    ...MODELS.buildings, MODELS.tree, ...MODELS.props,
    ...MODELS.cars, ...MODELS.men, MODELS.player
  ];
  const unique = [...new Set(all)];
  await Promise.all(unique.map(loadModel));
}

// ---------- Static (non-animated) model instance helper ----------
// Buildings, trees, props, cars: simple clone, re-centered on X/Z,
// uniformly scaled so its height (or length) matches targetSize.
function makeStaticInstance(path, targetSize, axis = 'y') {
  const data = getModel(path);
  const inst = data.gltf.scene.clone(true);
  const scale = targetSize / data.size[axis];
  inst.scale.setScalar(scale);
  inst.position.set(-data.center.x * scale, 0, -data.center.z * scale);
  inst.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return { inst, scaledSize: { x: data.size.x * scale, y: data.size.y * scale, z: data.size.z * scale } };
}

// ============================================================
//  CONTACT SHADOWS - a soft radial-gradient circle dropped flat
//  on the ground under every object. This is a cheap fake for
//  ambient occlusion: real SSAO is too costly for mobile GPUs,
//  but a dark blob under each object's feet reads as "grounded"
//  almost as well and costs nothing but one extra transparent
//  plane per object (shared geometry/texture, only scale differs).
// ============================================================
function makeContactShadowTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(0,0,0,0.45)');
  grad.addColorStop(0.7, 'rgba(0,0,0,0.18)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const contactShadowTexture = makeContactShadowTexture();
const contactShadowGeo = new THREE.PlaneGeometry(1, 1);
function addContactShadow(parent, radius) {
  const mat = new THREE.MeshBasicMaterial({
    map: contactShadowTexture, transparent: true, depthWrite: false, fog: false
  });
  const blob = new THREE.Mesh(contactShadowGeo, mat);
  blob.rotation.x = -Math.PI / 2;
  blob.scale.set(radius * 2, radius * 2, 1);
  blob.position.y = 0.03; // just above ground/road to avoid z-fighting
  parent.add(blob);
  return blob;
}

// ---------- City buildings / trees / props ----------
// Each spawn function now tags its obstacle entry with the chunk it belongs
// to, so a whole chunk's worth of obstacles can be dropped in one pass
// when that chunk unloads (see unloadChunk below).
function spawnBuilding(x, z, chunkKey) {
  const path = MODELS.buildings[Math.floor(Math.random() * MODELS.buildings.length)];
  const targetHeight = 12 + Math.random() * 40;
  const { inst, scaledSize } = makeStaticInstance(path, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.floor(Math.random() * 4) * (Math.PI / 2);
  scene.add(wrapper);
  const radius = Math.sqrt(scaledSize.x * scaledSize.x + scaledSize.z * scaledSize.z) / 2;
  addContactShadow(wrapper, radius * 0.85);
  obstacles.push({ x, z, radius, chunkKey });
  return wrapper;
}
function spawnTree(x, z, chunkKey) {
  const targetHeight = 5 + Math.random() * 2.5;
  const { inst } = makeStaticInstance(MODELS.tree, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.random() * Math.PI * 2;
  scene.add(wrapper);
  addContactShadow(wrapper, 1.4);
  obstacles.push({ x, z, radius: 0.9, chunkKey }); // trunk collision, keep small so it feels natural
  return wrapper;
}
function spawnProp(path, x, z, targetHeight, collisionRadius, chunkKey) {
  const { inst } = makeStaticInstance(path, targetHeight, 'y');
  const wrapper = new THREE.Group();
  wrapper.add(inst);
  wrapper.position.set(x, 0, z);
  wrapper.rotation.y = Math.random() * Math.PI * 2;
  scene.add(wrapper);
  addContactShadow(wrapper, Math.max(collisionRadius || 0.6, 0.5));
  if (collisionRadius) obstacles.push({ x, z, radius: collisionRadius, chunkKey });
  return wrapper;
}

// ============================================================
//  CHUNK STREAMING - this is the actual "infinite world" part.
//  Each chunk is generated from a seeded RNG keyed on its (cx,cz)
//  grid coords, so the same chunk always looks the same if you
//  come back to it. Generating just means cloning already-cached
//  GLBs (see preloadAll above), which is cheap - that's what
//  makes doing this every frame practical on a phone.
// ============================================================
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const loadedChunks = new Map(); // "cx,cz" -> { objects: THREE.Object3D[] }
const HOME_CHUNK_KEY = '0,0';   // player's home sits in this chunk - skip buildings there so it stays clear

function generateChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (loadedChunks.has(key)) return;
  const rand = mulberry32(cx * 92821 + cz * 51937 + 1013904223);
  const objects = [];
  const ox = cx * CHUNK_SIZE, oz = cz * CHUNK_SIZE;

  // Road strips: this chunk's near edges (x=ox and z=oz). Adjacent chunks draw
  // their own near edges, so together every CHUNK_SIZE boundary gets exactly
  // one road - real geometry, so this is EXACTLY where isNearRoad/spawnCar think it is.
  const roadH = new THREE.Mesh(roadGeoH, roadMatH);
  roadH.rotation.x = -Math.PI/2;
  roadH.position.set(ox + CHUNK_SIZE/2, 0.01, oz + ROAD_WIDTH/2);
  roadH.receiveShadow = true;
  scene.add(roadH); objects.push(roadH);
  const laneH = new THREE.Mesh(roadGeoH, laneMatH);
  laneH.rotation.x = -Math.PI/2;
  laneH.position.set(ox + CHUNK_SIZE/2, 0.02, oz + ROAD_WIDTH/2);
  scene.add(laneH); objects.push(laneH);

  const roadV = new THREE.Mesh(roadGeoV, roadMatV);
  roadV.rotation.x = -Math.PI/2;
  roadV.position.set(ox + ROAD_WIDTH/2, 0.01, oz + CHUNK_SIZE/2);
  roadV.receiveShadow = true;
  scene.add(roadV); objects.push(roadV);
  const laneV = new THREE.Mesh(roadGeoV, laneMatV);
  laneV.rotation.x = -Math.PI/2;
  laneV.position.set(ox + ROAD_WIDTH/2, 0.02, oz + CHUNK_SIZE/2);
  scene.add(laneV); objects.push(laneV);

  if (key !== HOME_CHUNK_KEY) {
    const buildingCount = 2 + Math.floor(rand() * 3);
    for (let i = 0; i < buildingCount; i++) {
      const bx = ox + BUILDING_MARGIN + rand() * (CHUNK_SIZE - BUILDING_MARGIN * 2);
      const bz = oz + BUILDING_MARGIN + rand() * (CHUNK_SIZE - BUILDING_MARGIN * 2);
      objects.push(spawnBuilding(bx, bz, key));
    }
  }
  const treeCount = 2 + Math.floor(rand() * 4);
  for (let i = 0; i < treeCount; i++) {
    const tx = ox + rand() * CHUNK_SIZE, tz = oz + rand() * CHUNK_SIZE;
    if (!isNearRoad(tx, tz)) objects.push(spawnTree(tx, tz, key));
  }
  const propRoll = rand();
  const px = ox + rand() * CHUNK_SIZE, pz = oz + rand() * CHUNK_SIZE;
  if (!isNearRoad(px, pz)) {
    if (propRoll < 0.35) objects.push(spawnProp('models/city/Bench.glb', px, pz, 1.1, 1.2, key));
    else if (propRoll < 0.6) objects.push(spawnProp('models/city/Trash Can.glb', px, pz, 1.0, 0.5, key));
    else if (propRoll < 0.8) objects.push(spawnProp('models/city/Fire hydrant.glb', px, pz, 0.7, 0.4, key));
  }
  objects.push(spawnProp('models/city/Traffic Light.glb', ox + ROAD_WIDTH + 3, oz + ROAD_WIDTH + 3, 4.5, 0.5, key));

  loadedChunks.set(key, { objects });
}
function unloadChunk(key) {
  const chunk = loadedChunks.get(key);
  if (!chunk) return;
  chunk.objects.forEach(obj => scene.remove(obj)); // geometry/materials are shared clones of the model cache - never dispose those, only detach
  for (let i = obstacles.length - 1; i >= 0; i--) {
    if (obstacles[i].chunkKey === key) obstacles.splice(i, 1);
  }
  loadedChunks.delete(key);
}
function updateChunks(playerX, playerZ) {
  const pcx = Math.floor(playerX / CHUNK_SIZE), pcz = Math.floor(playerZ / CHUNK_SIZE);
  for (let dx = -RENDER_RADIUS; dx <= RENDER_RADIUS; dx++)
    for (let dz = -RENDER_RADIUS; dz <= RENDER_RADIUS; dz++)
      generateChunk(pcx + dx, pcz + dz);
  for (const key of [...loadedChunks.keys()]) {
    const [cx, cz] = key.split(',').map(Number);
    if (Math.max(Math.abs(cx - pcx), Math.abs(cz - pcz)) > UNLOAD_RADIUS) unloadChunk(key);
  }
}

// ============================================================
//  CHARACTERS (player + NPCs) - skinned GLB with animations
// ============================================================
function findClip(clips, wanted) {
  return clips.find(c => c.name.toLowerCase().includes(wanted.toLowerCase()));
}

function spawnCharacter(path, targetHeight) {
  const data = getModel(path);
  const clone = THREE.SkeletonUtils.clone(data.gltf.scene);
  const scale = targetHeight / data.size.y;
  clone.scale.setScalar(scale);
  clone.position.set(-data.center.x * scale, 0, -data.center.z * scale);
  clone.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  const orientFix = new THREE.Group();
  orientFix.rotation.y = CHAR_FACING_OFFSET;
  orientFix.add(clone);

  const root = new THREE.Group();
  root.add(orientFix);
  addContactShadow(root, targetHeight * 0.24); // small blob under feet, scales with character height

  const mixer = new THREE.AnimationMixer(clone);
  const clips = data.gltf.animations;
  const idleClip = findClip(clips, 'Idle_Neutral') || findClip(clips, 'Idle') || clips[0];
  const walkClip = findClip(clips, 'Walk') || clips[0];
  const runClip = findClip(clips, 'Run');   // optional - not every character pack has a dedicated run clip
  const jumpClip = findClip(clips, 'Jump'); // optional

  const idleAction = mixer.clipAction(idleClip);
  const walkAction = mixer.clipAction(walkClip);
  walkAction.timeScale = WALK_ANIM_SPEED; // leg-swing speed matched to WALK_SPEED (tweak above if it slides/looks off)
  idleAction.play();

  // Run: use the model's own Run clip if it has one, else reuse the walk
  // clip sped up - still reads clearly as "running" on screen.
  const runAction = mixer.clipAction(runClip || walkClip);
  runAction.timeScale = runClip ? RUN_ANIM_SPEED : RUN_ANIM_SPEED * 1.6;

  // Jump: only if the model actually has a jump pose. Otherwise the jump is
  // still fully functional (see triggerJump/physics below), just without a
  // dedicated animation - the character arcs up and down in its walk/idle pose.
  let jumpAction = null;
  if (jumpClip) {
    jumpAction = mixer.clipAction(jumpClip);
    jumpAction.setLoop(THREE.LoopOnce, 1);
    jumpAction.clampWhenFinished = true;
  }

  return {
    group: root, mixer, idleAction, walkAction, runAction, jumpAction,
    current: idleAction, grounded: true, velocityY: 0
  };
}

// state: 'idle' | 'walk' | 'run' - crossfades between the three so weight
// transfer looks natural instead of snapping straight into a new pose.
function setMoveState(person, state) {
  const target = state === 'run' ? person.runAction : state === 'walk' ? person.walkAction : person.idleAction;
  if (person.current !== target) {
    target.reset().fadeIn(ANIM_BLEND).play();
    person.current.fadeOut(ANIM_BLEND);
    person.current = target;
  }
}

function triggerJump(person) {
  if (!person.jumpAction) return;
  person.jumpAction.reset().play();
  person.current.fadeOut(0.1);
  person.current = person.jumpAction;
}

// ---------- Player character ----------
let player;

// ---------- Controls ----------
// Extra safety net: some browsers still allow pinch-zoom / double-tap-zoom
// even with touch-action:none in CSS, which was making the page zoom in and
// get stuck (joystick/buttons pushed off-screen). Block it explicitly here.
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) e.preventDefault(); // pinch
}, { passive:false });
let lastTapTime = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300) e.preventDefault(); // double-tap zoom
  lastTapTime = now;
}, { passive:false });
document.addEventListener('gesturestart', (e) => e.preventDefault()); // iOS Safari pinch

const keys = { forward:false, backward:false, left:false, right:false, run:false };
let jumpRequested = false; // edge-triggered: consumed once per press in animate()

window.addEventListener('keydown', (e) => {
  switch(e.key.toLowerCase()){
    case 'w': case 'arrowup': keys.forward = true; break;
    case 's': case 'arrowdown': keys.backward = true; break;
    case 'a': case 'arrowleft': keys.left = true; break;
    case 'd': case 'arrowright': keys.right = true; break;
    case 'shift': keys.run = true; break;
    case ' ': jumpRequested = true; e.preventDefault(); break;
  }
});
window.addEventListener('keyup', (e) => {
  switch(e.key.toLowerCase()){
    case 'w': case 'arrowup': keys.forward = false; break;
    case 's': case 'arrowdown': keys.backward = false; break;
    case 'a': case 'arrowleft': keys.left = false; break;
    case 'd': case 'arrowright': keys.right = false; break;
    case 'shift': keys.run = false; break;
  }
});

// ============================================================
//  TOUCH CONTROLS - each control tracks its OWN finger by
//  touch.identifier instead of the shared e.touches[0]. Using
//  touches[0] meant whichever finger touched the screen FIRST
//  (anywhere - joystick, a button, or a look-drag) hijacked every
//  other control's position reading, e.g. dragging the joystick
//  with one finger while look-dragging with another made the
//  camera read the joystick finger's movement instead - causing
//  the "opposite/random view" behaviour. Tracking identifiers
//  means each finger only ever drives the control it started on,
//  no matter how many other fingers are on screen at once.
// ============================================================
function getTouchById(touchList, id) {
  for (let i = 0; i < touchList.length; i++) {
    if (touchList[i].identifier === id) return touchList[i];
  }
  return null;
}

// Mobile Run/Jump buttons
const runBtn = document.getElementById('runBtn');
const jumpBtn = document.getElementById('jumpBtn');
let runTouchId = null;
runBtn.addEventListener('touchstart', (e) => {
  if (runTouchId !== null) return; // already held by another finger
  const t = e.changedTouches[0];
  runTouchId = t.identifier;
  keys.run = true; runBtn.classList.add('active');
  e.preventDefault(); e.stopPropagation();
}, {passive:false});
runBtn.addEventListener('touchend', (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === runTouchId) {
      runTouchId = null;
      keys.run = false; runBtn.classList.remove('active');
    }
  }
  e.preventDefault(); e.stopPropagation();
}, {passive:false});
jumpBtn.addEventListener('touchstart', (e) => {
  jumpRequested = true;
  e.preventDefault(); e.stopPropagation();
}, {passive:false});

// Mobile joystick
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joyTouchId = null, joyStart = {x:0,y:0}, joyVec = {x:0,y:0};

joystick.addEventListener('touchstart', (e) => {
  if (joyTouchId !== null) return; // already tracking a finger
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joyStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
  e.stopPropagation();
}, {passive:false});
joystick.addEventListener('touchmove', (e) => {
  if (joyTouchId === null) return;
  const t = getTouchById(e.changedTouches, joyTouchId);
  if (!t) return; // this move event belongs to a different finger
  let dx = t.clientX - joyStart.x;
  let dy = t.clientY - joyStart.y;
  const max = 75;
  const len = Math.sqrt(dx*dx+dy*dy);
  if(len > max){ dx = dx/len*max; dy = dy/len*max; }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec = { x: dx/max, y: dy/max };
  e.preventDefault();
  e.stopPropagation();
}, {passive:false});
joystick.addEventListener('touchend', (e) => {
  if (!getTouchById(e.changedTouches, joyTouchId)) return; // a different finger lifted
  joyTouchId = null;
  joyVec = {x:0,y:0};
  stick.style.transform = 'translate(0px,0px)';
  e.stopPropagation();
});

// ---------- Camera look-around by dragging anywhere else on screen ----------
let camYawOffset = 0;
let camPitchOffset = 0;
let lookTouchId = null;
let lookStart = { x:0, y:0 };
const LOOK_SENSITIVITY = 0.0045; // slightly gentler than before, tuned for the now-isolated finger

renderer.domElement.addEventListener('touchstart', (e) => {
  if (lookTouchId !== null) return; // already tracking a look finger
  // Only start a look-drag from a finger that isn't already driving the joystick/buttons -
  // changedTouches here only contains NEW touches on the canvas itself, so joystick/button
  // touches (which target their own elements) never reach this handler at all.
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lookStart = { x: t.clientX, y: t.clientY };
}, {passive:true});
renderer.domElement.addEventListener('touchmove', (e) => {
  if (lookTouchId === null) return;
  const t = getTouchById(e.changedTouches, lookTouchId);
  if (!t) return; // this move event belongs to a different finger
  const dx = t.clientX - lookStart.x;
  const dy = t.clientY - lookStart.y;
  camYawOffset -= dx * LOOK_SENSITIVITY;
  camPitchOffset = THREE.MathUtils.clamp(camPitchOffset + dy * LOOK_SENSITIVITY, -0.34, 0.69);
  lookStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, {passive:false});
renderer.domElement.addEventListener('touchend', (e) => {
  if (!getTouchById(e.changedTouches, lookTouchId)) return; // a different finger lifted
  lookTouchId = null;
});
renderer.domElement.addEventListener('touchcancel', (e) => {
  if (!getTouchById(e.changedTouches, lookTouchId)) return;
  lookTouchId = null;
});
runBtn.addEventListener('touchcancel', (e) => {
  if (!getTouchById(e.changedTouches, runTouchId)) return;
  runTouchId = null;
  keys.run = false; runBtn.classList.remove('active');
});
joystick.addEventListener('touchcancel', (e) => {
  if (!getTouchById(e.changedTouches, joyTouchId)) return;
  joyTouchId = null;
  joyVec = {x:0,y:0};
  stick.style.transform = 'translate(0px,0px)';
});


// ---------- NPCs: pedestrians roaming the city ----------
// Fixed pool that gets RECYCLED near the player instead of a one-time
// scatter over a fixed box - that's what lets pedestrians exist however
// far the player walks, without the pool size ever growing.
const NPC_COUNT = 22;
const npcs = [];
function spawnNPC(x, z) {
  const path = MODELS.men[Math.floor(Math.random() * MODELS.men.length)];
  const person = spawnCharacter(path, 1.75 + Math.random()*0.3);
  person.group.position.set(x, 0, z);
  scene.add(person.group);
  setMoveState(person, 'walk'); // NPCs wander constantly -> keep them in walk cycle
  npcs.push({
    person,
    angle: Math.random() * Math.PI * 2,
    speed: 1.3 + Math.random() * 1.2,
    timer: 2 + Math.random() * 3
  });
}
function repositionNPC(npc, px, pz) {
  const range = RENDER_RADIUS * CHUNK_SIZE;
  npc.person.group.position.set(px + (Math.random()-0.5)*range*2, 0, pz + (Math.random()-0.5)*range*2);
  npc.angle = Math.random() * Math.PI * 2;
  npc.timer = 2 + Math.random() * 3;
}
function spawnAllNPCs(px, pz) {
  const range = RENDER_RADIUS * CHUNK_SIZE;
  for (let i = 0; i < NPC_COUNT; i++) {
    spawnNPC(px + (Math.random()-0.5)*range*2, pz + (Math.random()-0.5)*range*2);
  }
}

// ============================================================
//  CARS driving around the roads - same recycling idea as NPCs:
//  a fixed pool, snapped onto the nearest road grid line to the
//  player and re-placed whenever it drifts out of range.
// ============================================================
function makeCarMesh(path) {
  const targetLength = 4.3;
  const { inst } = makeStaticInstance(path, targetLength, 'z');
  const orientFix = new THREE.Group();
  orientFix.rotation.y = CAR_FACING_OFFSET;
  orientFix.add(inst);
  const carRoot = new THREE.Group();
  carRoot.add(orientFix);
  addContactShadow(carRoot, 2.6);
  return carRoot;
}
function snapToRoadGrid(v) { return Math.round(v / CHUNK_SIZE) * CHUNK_SIZE; }

const CARS_PER_AXIS_PER_DIR = 3;
const cars = [];
function spawnCar(axis, speed) {
  const path = MODELS.cars[Math.floor(Math.random() * MODELS.cars.length)];
  const mesh = makeCarMesh(path);
  scene.add(mesh);
  const car = { mesh, axis, speed, laneOffset: speed > 0 ? 3 : -3 };
  cars.push(car);
  return car;
}
function repositionCar(car, px, pz) {
  const range = RENDER_RADIUS * CHUNK_SIZE;
  const lane = ROAD_WIDTH / 2 + car.laneOffset;
  if (car.axis === 'x') {
    const laneZ = snapToRoadGrid(pz + (Math.random()-0.5)*range) + lane;
    car.mesh.position.set(px - Math.sign(car.speed) * range, 0, laneZ);
    car.mesh.rotation.y = car.speed > 0 ? 0 : Math.PI;
  } else {
    const laneX = snapToRoadGrid(px + (Math.random()-0.5)*range) + lane;
    car.mesh.position.set(laneX, 0, pz - Math.sign(car.speed) * range);
    car.mesh.rotation.y = car.speed > 0 ? -Math.PI / 2 : Math.PI / 2;
  }
}
function spawnAllCars(px, pz) {
  ['x', 'z'].forEach(axis => {
    for (let i = 0; i < CARS_PER_AXIS_PER_DIR; i++) {
      const speed = 9 + Math.random() * 5;
      [speed, -speed].forEach(s => repositionCar(spawnCar(axis, s), px, pz));
    }
  });
}

// ---------- Generic circle-collision helper ----------
function pushApart(posA, radiusA, posB, radiusB, moveA, moveB) {
  const dx = posA.x - posB.x;
  const dz = posA.z - posB.z;
  const distSq = dx*dx + dz*dz;
  const minDist = radiusA + radiusB;
  if (distSq < minDist * minDist) {
    const dist = Math.sqrt(distSq) || 0.001;
    const overlap = minDist - dist;
    const nx = dx / dist, nz = dz / dist;
    if (moveA && moveB) {
      posA.x += nx * overlap * 0.5; posA.z += nz * overlap * 0.5;
      posB.x -= nx * overlap * 0.5; posB.z -= nz * overlap * 0.5;
    } else if (moveA) {
      posA.x += nx * overlap; posA.z += nz * overlap;
    } else if (moveB) {
      posB.x -= nx * overlap; posB.z -= nz * overlap;
    }
    return true;
  }
  return false;
}

const PLAYER_RADIUS = 0.6;
const NPC_RADIUS = 0.55;
const CAR_RADIUS = 2.3; // circle approximation of the car's footprint

// ---------- Movement + camera follow ----------
let playerAngle = 0;
const WALK_SPEED = 4.2;    // units per second (slowed down further from 6.5 for a realistic human walk pace)
const RUN_SPEED = 8.5;     // units per second while holding Run
const TURN_RATE = 12;      // rad/sec - how fast the character body rotates to face its new movement direction (fast but not an instant snap)
const WALK_ANIM_SPEED = 0.72; // leg-swing rate tuned to WALK_SPEED so feet don't slide on the ground
const RUN_ANIM_SPEED = 1.15;  // leg-swing rate tuned to RUN_SPEED
const ANIM_BLEND = 0.18;   // fade time between idle/walk/run - snappier weight-transfer feels more natural
const GRAVITY = -26;       // units/sec^2
const JUMP_SPEED = 8.5;    // initial upward velocity on jump

// Rotates `current` toward `target` (both radians) by at most `maxDelta`,
// always taking the shortest way around the circle (e.g. 350deg -> 10deg
// turns +20deg, not -340deg).
function turnTowardsAngle(current, target, maxDelta) {
  let diff = ((target - current + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  diff = THREE.MathUtils.clamp(diff, -maxDelta, maxDelta);
  return current + diff;
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // ============================================================
  //  CAMERA-RELATIVE MOVEMENT
  //  moveX/moveZ are LOCAL input (right+ / forward+), from keyboard
  //  or joystick. They get rotated by the camera's current yaw so
  //  "push joystick up" always means "go the way the camera is
  //  looking" - wherever you've dragged the camera to - instead of
  //  the old tank-control scheme where left/right spun the player
  //  in place regardless of the camera. The player then smoothly
  //  turns to face wherever it ends up actually moving.
  // ============================================================
  let moveX = 0, moveZ = 0;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;
  if (keys.forward) moveZ += 1;
  if (keys.backward) moveZ -= 1;

  if (Math.abs(joyVec.x) > 0.08 || Math.abs(joyVec.y) > 0.08) {
    moveX += joyVec.x;
    moveZ += -joyVec.y;
  }

  const inputLen = Math.min(1, Math.hypot(moveX, moveZ));

  const running = keys.run && inputLen > 0.001;
  const currentSpeed = running ? RUN_SPEED : WALK_SPEED;

  let didMove = false;
  if (inputLen > 0.001) {
    const camYaw = camYawOffset; // camera's own free-look yaw - see touch-drag handler below
    // rotate local (moveX=right, moveZ=forward) input into world space by camYaw
    const worldDirX = Math.sin(camYaw) * moveZ + Math.cos(camYaw) * moveX;
    const worldDirZ = Math.cos(camYaw) * moveZ - Math.sin(camYaw) * moveX;
    const dirLen = Math.hypot(worldDirX, worldDirZ) || 1;
    const dirX = worldDirX / dirLen, dirZ = worldDirZ / dirLen;

    player.group.position.x += dirX * inputLen * currentSpeed * dt;
    player.group.position.z += dirZ * inputLen * currentSpeed * dt;
    didMove = true;

    const targetAngle = Math.atan2(dirX, dirZ);
    playerAngle = turnTowardsAngle(playerAngle, targetAngle, TURN_RATE * dt);
    player.group.rotation.y = playerAngle;
  }

  // ---- jump: simple physics arc (gravity + initial upward velocity), independent of the walk/run state ----
  if (jumpRequested) {
    jumpRequested = false;
    if (player.grounded) {
      player.velocityY = JUMP_SPEED;
      player.grounded = false;
      triggerJump(player);
    }
  }
  if (!player.grounded) {
    player.velocityY += GRAVITY * dt;
    player.group.position.y += player.velocityY * dt;
    if (player.group.position.y <= 0) {
      player.group.position.y = 0;
      player.velocityY = 0;
      player.grounded = true;
    }
  }

  // Only drive idle/walk/run crossfades while grounded, so a jump animation
  // (if the model has one) isn't immediately interrupted mid-air.
  if (player.grounded) {
    setMoveState(player, didMove ? (running ? 'run' : 'walk') : 'idle');
  }
  player.mixer.update(dt);

  // load/unload chunks around the player's new position - the core of the infinite world
  updateChunks(player.group.position.x, player.group.position.z);

  // ---- collision: push player out of any overlapping static obstacle (building/tree/home/prop) ----
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    pushApart(player.group.position, PLAYER_RADIUS, ob, ob.radius, true, false);
  }

  // ---- NPCs: wander around, avoid obstacles, play walk animation ----
  npcs.forEach(npc => {
    npc.timer -= dt;
    if (npc.timer <= 0) {
      npc.angle += (Math.random() - 0.5) * Math.PI;
      npc.timer = 2 + Math.random() * 3;
    }
    const dir = new THREE.Vector3(Math.sin(npc.angle), 0, Math.cos(npc.angle));
    npc.person.group.position.addScaledVector(dir, npc.speed * dt);
    npc.person.group.rotation.y = npc.angle;

    const distToPlayer = npc.person.group.position.distanceTo(player.group.position);
    if (distToPlayer > (RENDER_RADIUS + 1) * CHUNK_SIZE) {
      repositionNPC(npc, player.group.position.x, player.group.position.z);
      return; // freshly placed - skip this frame's obstacle push
    }

    let bumped = false;
    const pos = npc.person.group.position;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (pushApart(pos, NPC_RADIUS, ob, ob.radius, true, false)) bumped = true;
    }
    if (bumped) {
      npc.angle += Math.PI + (Math.random() - 0.5); // turn around when hitting something
      npc.timer = 1 + Math.random() * 2;
    }

    npc.person.mixer.update(dt);
  });

  // ---- player vs NPCs: neither can walk through the other ----
  npcs.forEach(npc => {
    pushApart(player.group.position, PLAYER_RADIUS, npc.person.group.position, NPC_RADIUS, true, true);
  });

  // ---- NPCs vs each other: don't let pedestrians overlap/stack ----
  for (let i = 0; i < npcs.length; i++) {
    for (let j = i + 1; j < npcs.length; j++) {
      pushApart(npcs[i].person.group.position, NPC_RADIUS, npcs[j].person.group.position, NPC_RADIUS, true, true);
    }
  }

  // ---- Cars: drive along their lane; recycle to a fresh lane near the player once they're far away ----
  const carRange = (RENDER_RADIUS + 1) * CHUNK_SIZE;
  cars.forEach(c => {
    if (c.axis === 'x') c.mesh.position.x += c.speed * dt;
    else c.mesh.position.z += c.speed * dt;

    const coord = c.axis === 'x' ? c.mesh.position.x : c.mesh.position.z;
    const playerCoord = c.axis === 'x' ? player.group.position.x : player.group.position.z;
    if (Math.abs(coord - playerCoord) > carRange) {
      repositionCar(c, player.group.position.x, player.group.position.z);
    }
  });

  // ---- cars vs player and cars vs NPCs: cars stay on their lane, everyone else gets pushed clear ----
  cars.forEach(c => {
    pushApart(player.group.position, PLAYER_RADIUS, c.mesh.position, CAR_RADIUS, true, false);
    npcs.forEach(npc => {
      pushApart(npc.person.group.position, NPC_RADIUS, c.mesh.position, CAR_RADIUS, true, false);
    });
  });

  // ============================================================
  //  CAMERA - true spherical orbit around the player.
  //  camYawOffset: pure drag-controlled yaw. It is NO LONGER added
  //  to playerAngle - the camera is a free camera you park wherever
  //  you leave it; it does not spin along with the character anymore
  //  (that coupling was what made movement feel tied to the body's
  //  own rotation instead of the camera).
  //  camPitchOffset: drag-controlled elevation, combined with a
  //  fixed BASE_PITCH and clamped so it can't flip over the top or
  //  dip underground. The look-at point no longer shifts height with
  //  pitch (the old version raised/lowered BOTH camera height and
  //  look target by different amounts, which is what made dragging
  //  up sometimes visually tilt the view down - opposite of intent).
  // ============================================================
  const ORBIT_DIST = 11.2;   // straight-line distance from player, matches the old ~10 horizontal / 5 vertical setup
  const BASE_PITCH = 0.46;   // ~26 degrees - default camera elevation above the player
  const pitch = THREE.MathUtils.clamp(BASE_PITCH + camPitchOffset, 0.12, 1.15); // ~7deg (near-level) to ~66deg (near-overhead)
  const orbitYaw = camYawOffset;
  const horizDist = ORBIT_DIST * Math.cos(pitch);
  const vertDist = ORBIT_DIST * Math.sin(pitch);
  const camOffset = new THREE.Vector3(
    -Math.sin(orbitYaw) * horizDist,
    vertDist,
    -Math.cos(orbitYaw) * horizDist
  );
  const desiredCamPos = player.group.position.clone().add(camOffset);
  camera.position.lerp(desiredCamPos, 0.15);
  const lookTarget = player.group.position.clone().add(new THREE.Vector3(0, 1.5, 0)); // fixed height - camera pitches around this point instead of chasing a moving target
  camera.lookAt(lookTarget);

  // Camera intentionally does NOT auto-recenter anymore - it stays exactly
  // where you rotate it. Drag on screen again anytime to adjust manually.

  renderer.render(scene, camera);
}

// ============================================================
//  INIT: preload every GLB once, THEN build the world (sync,
//  cheap clones) and finally start the render loop.
// ============================================================
async function init() {
  await preloadAll();

  buildHome();
  buildPlayer();
  updateChunks(player.group.position.x, player.group.position.z);
  spawnAllNPCs(player.group.position.x, player.group.position.z);
  spawnAllCars(player.group.position.x, player.group.position.z);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('info').style.display = 'block';
  document.getElementById('joystick').style.display = 'block';
  document.getElementById('actionButtons').style.display = 'flex';

  animate();
}
init();
</script>
</body>
</html>
