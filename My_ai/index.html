<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content">
<title>Chaman AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12100e;
    --ink-2:#1a1713;
    --ink-3:#221e18;
    --line:#332d24;
    --paper:#ede7dd;
    --paper-dim:#a89d8a;
    --amber:#e8a33d;
    --amber-dim:#8a6a30;
    --sage:#7c9473;
    --sage-dim:#3a4235;
    --rust:#b24c2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(232,163,61,0.07), transparent),
      radial-gradient(ellipse 600px 400px at 100% 10%, rgba(124,148,115,0.06), transparent);
    color:var(--paper);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh; /* mobile chrome address-bar ke saath sahi height */
    overflow:hidden;
  }

  /* ── header ── */
  header{
    flex:0 0 auto;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--ink-2), transparent);
    position:relative;
    z-index:5;
  }
  .icon-btn{
    all:unset;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--ink-3);}
  .burger{display:flex;flex-direction:column;gap:4px;width:18px;}
  .burger span{display:block;height:2px;width:100%;background:var(--paper);border-radius:1px;}

  .chain{display:flex;gap:6px;align-items:center;}
  .chain .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
    transition:background .3s, box-shadow .3s;
  }
  .chain .dot.live{
    background:var(--amber);
    box-shadow:0 0 8px rgba(232,163,61,0.7);
  }

  /* ── sessions drawer ── */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;pointer-events:none;
    transition:opacity .25s;
    z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .drawer{
    position:fixed;top:0;left:0;bottom:0;
    width:78%;max-width:280px;
    background:var(--ink-2);
    border-right:1px solid var(--line);
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:21;
    display:flex;
    flex-direction:column;
    padding:18px 14px;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:2px 4px 16px;}
  .drawer-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--amber);
    letter-spacing:-0.02em;
  }
  .new-chat-btn{
    all:unset;
    box-sizing:border-box;
    display:block;
    width:100%;
    text-align:center;
    padding:10px;
    margin-bottom:16px;
    border:1px solid var(--amber-dim);
    border-radius:9px;
    color:var(--amber);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
  }
  .new-chat-btn:active{background:rgba(232,163,61,0.08);}
  .drawer-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:0 4px 8px;
  }
  .session-list{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .session-item{
    all:unset;
    box-sizing:border-box;
    display:block;
    width:100%;
    padding:10px 10px;
    border-radius:8px;
    color:var(--paper-dim);
    font-size:13.5px;
    line-height:1.4;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border-left:2px solid transparent;
  }
  .session-item:active{background:var(--ink-3);}
  .session-item.active{
    color:var(--paper);
    background:var(--ink-3);
    border-left-color:var(--amber);
  }
  .session-empty{
    padding:10px;
    color:var(--paper-dim);
    font-size:12.5px;
    font-style:italic;
  }

  /* ── chat area ── */
  main{
    flex:1 1 auto;
    min-height:0; /* CRITICAL: without this, flex item won't shrink and pushes the form off-screen */
    overflow-y:auto;
    padding:22px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  main::-webkit-scrollbar{width:0;}

  .empty{
    margin:auto;
    text-align:center;
    color:var(--paper-dim);
    max-width:280px;
  }
  .empty .glyph-big{
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    color:var(--amber-dim);
    margin-bottom:8px;
  }
  .empty p{font-size:13px;line-height:1.6;margin:0;}

  .row{display:flex;max-width:100%;}
  .row.user{justify-content:flex-end;}
  .row.assistant{justify-content:flex-start;}

  .bubble{
    max-width:82%;
    padding:11px 14px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--sage-dim);
    border:1px solid rgba(124,148,115,0.35);
    color:#dfe8db;
    border-radius:14px 14px 3px 14px;
  }
  .row.assistant .bubble{
    background:transparent;
    border-left:2px solid var(--amber-dim);
    padding-left:13px;
    color:var(--paper);
    border-radius:2px;
    max-width:100%; /* .wrap already caps width at 82% — bubble should fill it fully, not re-shrink */
  }
  .bubble strong{color:var(--amber);font-weight:600;}
  .bubble em{font-style:italic;color:#f3ead8;}
  .bubble .inline-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.88em;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
    color:#f0c988;
  }
  .codeblock{
    margin:8px 0;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--ink-3);
  }
  .codeblock-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    background:var(--ink-2);
    border-bottom:1px solid var(--line);
  }
  .codeblock-head .lang{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    text-transform:lowercase;
    letter-spacing:0.03em;
  }
  .copy-btn{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:5px;
    padding:3px 9px;
    cursor:pointer;
    line-height:1;
  }
  .copy-btn:active{transform:scale(0.94);}
  .copy-btn.copied{color:var(--sage);border-color:var(--sage-dim);}
  .codeblock pre{
    margin:0;
    padding:10px 12px;
    overflow-x:auto;
  }
  .codeblock code{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    line-height:1.5;
    color:#e6ddc9;
    white-space:pre;
  }
  .md-p{margin:0 0 10px;}
  .md-p:last-child{margin-bottom:0;}
  .md-h{
    font-family:'Space Grotesk',sans-serif;
    color:var(--amber);
    line-height:1.3;
    margin:14px 0 8px;
  }
  .bubble > .md-h:first-child{margin-top:0;}
  h1.md-h{font-size:19px;}
  h2.md-h{font-size:17px;}
  h3.md-h{font-size:15.5px;}
  h4.md-h,h5.md-h,h6.md-h{font-size:14.5px;color:var(--paper);}
  .md-list{
    margin:0 0 10px;
    padding-left:20px;
  }
  .md-list li{margin-bottom:4px;line-height:1.5;}
  .md-list:last-child{margin-bottom:0;}
  .md-table-wrap{
    overflow-x:auto;
    margin:8px 0 10px;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .md-table{
    border-collapse:collapse;
    width:100%;
    font-size:13.5px;
  }
  .md-table th,.md-table td{
    padding:7px 11px;
    border-bottom:1px solid var(--line);
    text-align:left;
    white-space:nowrap;
  }
  .md-table th{
    background:var(--ink-3);
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .md-table tr:last-child td{border-bottom:none;}
  .md-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--paper-dim);
    margin-top:5px;
    padding-left:13px;
  }
  .row.assistant .wrap{display:flex;flex-direction:column;max-width:82%;}

  .thinking{
    display:flex;gap:4px;padding-left:13px;border-left:2px solid var(--amber-dim);
  }
  .thinking span{
    width:5px;height:5px;border-radius:50%;background:var(--amber-dim);
    animation:pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.85);}40%{opacity:1;transform:scale(1);}}

  .err{color:var(--rust);}

  /* ── typewriter cursor ── */
  .bubble.typing::after{
    content:'';
    display:inline-block;
    width:2px;
    height:1em;
    margin-left:2px;
    background:var(--amber);
    vertical-align:text-bottom;
    animation:blink .8s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  /* ── ask_user action ── */
  .ask-user{
    margin-top:8px;
    padding-top:10px;
    border-top:1px dashed var(--amber-dim);
  }
  .ask-user-q{
    font-size:13px;
    color:var(--amber-dim);
    margin-bottom:8px;
  }
  .ask-user-opts{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .ask-user-opt{
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--amber-dim);
    background:transparent;
    color:var(--amber);
    font:inherit;
    font-size:13px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .ask-user-opt:active{background:var(--ink-3);}
  .ask-user-opt.selected{
    background:var(--amber);
    color:var(--ink);
    border-color:var(--amber);
  }
  .ask-user-confirm{
    display:block;
    margin-top:10px;
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--sage-dim);
    background:var(--sage-dim);
    color:var(--ink);
    font:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .ask-user-confirm:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  /* ── input bar ── */
  form{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:var(--ink-2);
    border-top:1px solid var(--line);
  }
  .prompt-prefix{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--amber-dim);
    white-space:nowrap;
    user-select:none;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
    padding:11px 12px;
    max-height:110px;
    line-height:1.4;
  }
  textarea:focus{outline:none;border-color:var(--amber-dim);}
  textarea::placeholder{color:var(--paper-dim);}

  button{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:10px;
    border:1px solid var(--amber-dim);
    background:var(--amber);
    color:var(--ink);
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  button:disabled{opacity:.4;cursor:not-allowed;}
  button:active:not(:disabled){transform:scale(0.94);}
</style>
</head>
<body>

<header>
  <button id="menuBtn" class="icon-btn" aria-label="Menu" type="button">
    <span class="burger"><span></span><span></span><span></span></span>
  </button>
  <div class="chain" id="chain">
    <div class="dot" data-provider="Groq"></div>
    <div class="dot" data-provider="OpenRouter"></div>
    <div class="dot" data-provider="Cerebras"></div>
    <div class="dot" data-provider="Mistral"></div>
  </div>
</header>

<div id="overlay" class="overlay"></div>

<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <span class="drawer-title">Chaman AI</span>
  </div>
  <button id="newChatBtn" class="new-chat-btn" type="button">+ Naya chat</button>
  <div class="drawer-label">Sessions</div>
  <div id="sessionList" class="session-list"></div>
</aside>

<main id="main">
  <div class="empty" id="empty">
    <div class="glyph-big">⟡</div>
  </div>
</main>

<form id="form">
  <span class="prompt-prefix">&gt;</span>
  <textarea id="input" rows="1" placeholder="Type kar..." autocomplete="off"></textarea>
  <button id="send" type="submit">↑</button>
</form>

<script>
  const $main = document.getElementById('main');
  const $form = document.getElementById('form');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $dots = document.querySelectorAll('.chain .dot');
  const $menuBtn = document.getElementById('menuBtn');
  const $overlay = document.getElementById('overlay');
  const $drawer = document.getElementById('drawer');
  const $newChatBtn = document.getElementById('newChatBtn');
  const $sessionList = document.getElementById('sessionList');

  let history = []; // {role, content, provider?, model?} — current session ki poori raw chat
  let busy = false;
  let activeSessionId = null; // null = abhi tak koi reply nahi aaya, session bana hi nahi

  const SESSIONS_KEY = 'chamanai_sessions_v1';

  function loadSessions() {
    try {
      return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function isQuotaError(e) {
    return !!e && (
      e.name === 'QuotaExceededError' ||
      e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
      e.code === 22 ||
      e.code === 1014
    );
  }

  // Sabse purana session hata deta hai — current active session ko (agar possible ho)
  // bacha ke rakhta hai, kyunki wahi abhi save ho raha hota hai.
  function dropOldestSession(sessions) {
    if (sessions.length <= 1) return sessions.slice(0, 0); // ek hi bacha tha, use bhi hata do
    const sorted = [...sessions].sort((a, b) => a.updatedAt - b.updatedAt);
    const victim = sorted.find(s => s.id !== activeSessionId) || sorted[0];
    return sessions.filter(s => s.id !== victim.id);
  }

  // Storage full hone par purani sessions ko aahiste-aahiste (ek-ek karke) hata ke
  // retry karta hai, jab tak naya data fit na ho jaaye ya sessions khatam na ho jaayein.
  function saveSessions(sessions) {
    let list = sessions;
    while (true) {
      try {
        localStorage.setItem(SESSIONS_KEY, JSON.stringify(list));
        return;
      } catch (e) {
        if (!isQuotaError(e) || list.length === 0) {
          console.warn('localStorage save fail:', e);
          return;
        }
        list = dropOldestSession(list);
      }
    }
  }

  function sessionTitle(firstUserMsg) {
    const t = firstUserMsg.trim().replace(/\s+/g, ' ');
    return t.length > 42 ? t.slice(0, 42) + '…' : t;
  }

  // Session sirf tab banta hai jab pehla reply successfully aa jaaye — usse pehle
  // koi entry sidebar mein nahi dikhti, jaisa maanga gaya tha.
  function persistTurn() {
    const sessions = loadSessions();
    if (activeSessionId) {
      const s = sessions.find(s => s.id === activeSessionId);
      if (s) {
        s.messages = history;
        s.updatedAt = Date.now();
      }
    } else {
      const firstUserMsg = history.find(m => m.role === 'user')?.content || 'New chat';
      activeSessionId = String(Date.now());
      sessions.unshift({
        id: activeSessionId,
        title: sessionTitle(firstUserMsg),
        messages: history,
        updatedAt: Date.now(),
      });
    }
    saveSessions(sessions);
    renderSessionList();
  }

  function renderSessionList() {
    const sessions = loadSessions().sort((a, b) => b.updatedAt - a.updatedAt);
    $sessionList.innerHTML = '';
    if (!sessions.length) {
      $sessionList.innerHTML = '<div class="session-empty">Abhi koi session nahi — pehla message bhejo.</div>';
      return;
    }
    for (const s of sessions) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'session-item' + (s.id === activeSessionId ? ' active' : '');
      btn.textContent = s.title;
      btn.addEventListener('click', () => openSession(s.id));
      $sessionList.appendChild(btn);
    }
  }

  function clearMain() {
    $main.innerHTML = '<div class="empty" id="empty"><div class="glyph-big">⟡</div></div>';
  }

  function openSession(id) {
    const sessions = loadSessions();
    const s = sessions.find(s => s.id === id);
    if (!s) return;
    activeSessionId = id;
    history = s.messages;
    clearMain();
    for (const msg of history) {
      if (msg.role === 'user') {
        addUserBubble(msg.content);
      } else if (msg.role === 'assistant') {
        addAssistantBubble(msg.content, msg.provider ? `${msg.provider} · ${msg.model || ''}` : null, false, false);
      }
    }
    const last = history[history.length - 1];
    lightDot(last && last.provider ? last.provider : null);
    renderSessionList();
    closeDrawer();
  }

  function startNewChat() {
    activeSessionId = null;
    history = [];
    clearMain();
    lightDot(null);
    renderSessionList();
    closeDrawer();
    $input.focus();
  }

  function openDrawer() {
    $drawer.classList.add('open');
    $overlay.classList.add('open');
  }
  function closeDrawer() {
    $drawer.classList.remove('open');
    $overlay.classList.remove('open');
  }

  $menuBtn.addEventListener('click', openDrawer);
  $overlay.addEventListener('click', closeDrawer);
  $newChatBtn.addEventListener('click', startNewChat);

  // App load pe: hamesha ek fresh/naya session shuru hota hai. Purani sessions
  // localStorage mein save rehti hain aur drawer mein dikhti hain — bas auto-resume
  // nahi hoti, user manually tap karke khol sakta hai.
  (function init() {
    renderSessionList();
    history = [];
    activeSessionId = null;
    lightDot(null);
  })();

  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 110) + 'px';
  });

  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $form.requestSubmit();
    }
  });

  // Keyboard khulne pe kuch Android browsers `interactive-widget=resizes-content`
  // ko ignore karke poore page ko scroll kar dete hain (isse messages "upar" chale
  // jaate hain jab tak khud scroll na karo). visualViewport API se hum body ki
  // height ko keyboard ke hisaab se manually sync karte hain, aur input focus hote
  // hi neeche pin kar dete hain — taaki chat aur input box hamesha visible rahein.
  if (window.visualViewport) {
    const vv = window.visualViewport;
    function syncViewportHeight() {
      document.body.style.height = vv.height + 'px';
      window.scrollTo(0, 0);
      scrollBottom();
    }
    vv.addEventListener('resize', syncViewportHeight);
    vv.addEventListener('scroll', () => window.scrollTo(0, 0));
  }
  $input.addEventListener('focus', () => {
    // Keyboard animate hote hue thoda time leta hai — chhota delay ke baad pin karo.
    setTimeout(scrollBottom, 60);
    setTimeout(scrollBottom, 300);
  });

  function scrollBottom() {
    $main.scrollTop = $main.scrollHeight;
  }

  function addUserBubble(text) {
    const emptyEl = $main.querySelector('.empty');
    if (emptyEl) emptyEl.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    $main.appendChild(row);
    scrollBottom();
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'thinkingRow';
    row.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
    $main.appendChild(row);
    scrollBottom();
    return row;
  }

  // ── markdown renderer: headings, tables, lists, bold/italic/inline-code, fenced code blocks ──
  let cbCounter = 0;
  const codeStore = {}; // id -> {lang, code} (copy button ke liye, escaped HTML se alag rakha)

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // sirf inline patterns (bold/italic/inline-code) — block-level text ke andar use hota hai
  function inlineFormat(str) {
    let text = escapeHtml(str);
    text = text.replace(/`([^`\n]+)`/g, (_, c) => `<code class="inline-code">${c}</code>`);
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    return text;
  }

  function isSeparatorRow(line) {
    return line != null && line.includes('-') && /^\s*\|?[\s:\-|]+\|?\s*$/.test(line);
  }

  function splitTableRow(line) {
    let l = line.trim();
    if (l.startsWith('|')) l = l.slice(1);
    if (l.endsWith('|')) l = l.slice(0, -1);
    return l.split('|').map(c => c.trim());
  }

  function tableHtml(headerCells, rows) {
    const thead = `<tr>${headerCells.map(c => `<th>${inlineFormat(c)}</th>`).join('')}</tr>`;
    const tbody = rows
      .map(r => `<tr>${r.map(c => `<td>${inlineFormat(c)}</td>`).join('')}</tr>`)
      .join('');
    return `<div class="md-table-wrap"><table class="md-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
  }

  function codeBlockHtml(id) {
    const { lang, code } = codeStore[id];
    return `<div class="codeblock" data-id="${id}">
      <div class="codeblock-head">
        <span class="lang">${escapeHtml(lang || 'text')}</span>
        <button type="button" class="copy-btn" onclick="copyCode('${id}')">Copy</button>
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>
    </div>`;
  }

  function renderMarkdown(raw) {
    // step 1: fenced code blocks nikaal ke placeholder line daal do (raw text par, escape se pehle)
    const withPlaceholders = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const id = 'cb' + (cbCounter++);
      codeStore[id] = { lang: lang || '', code: code.replace(/\n$/, '') };
      return `\u0000${id}\u0000`;
    });

    const lines = withPlaceholders.split('\n');
    let html = '';
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      if (line.trim() === '') { i++; continue; }

      // fenced code placeholder
      if (/^\u0000cb\d+\u0000$/.test(line.trim())) {
        html += line.trim();
        i++;
        continue;
      }

      // heading
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const level = h[1].length;
        html += `<h${level} class="md-h">${inlineFormat(h[2])}</h${level}>`;
        i++;
        continue;
      }

      // table (current line has |, next line is the ---|--- separator)
      if (line.includes('|') && isSeparatorRow(lines[i + 1])) {
        const headerCells = splitTableRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() !== '' && lines[i].includes('|')) {
          rows.push(splitTableRow(lines[i]));
          i++;
        }
        html += tableHtml(headerCells, rows);
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        let items = '';
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items += `<li>${inlineFormat(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`;
          i++;
        }
        html += `<ul class="md-list">${items}</ul>`;
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        let items = '';
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          items += `<li>${inlineFormat(lines[i].replace(/^\s*\d+\.\s+/, ''))}</li>`;
          i++;
        }
        html += `<ol class="md-list">${items}</ol>`;
        continue;
      }

      // paragraph: consecutive plain lines until something else starts
      const paraLines = [];
      while (
        i < lines.length &&
        lines[i].trim() !== '' &&
        !/^#{1,6}\s+/.test(lines[i]) &&
        !/^\s*[-*]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i]) &&
        !/^\u0000cb\d+\u0000$/.test(lines[i].trim()) &&
        !(lines[i].includes('|') && isSeparatorRow(lines[i + 1]))
      ) {
        paraLines.push(lines[i]);
        i++;
      }
      if (paraLines.length) {
        html += `<p class="md-p">${paraLines.map(inlineFormat).join('<br>')}</p>`;
      } else {
        i++; // safety net, avoid infinite loop
      }
    }

    // step 2: code block placeholders ko asli block se replace karo
    html = html.replace(/\u0000(cb\d+)\u0000/g, (_, id) => codeBlockHtml(id));

    return html;
  }

  window.copyCode = function (id) {
    const entry = codeStore[id];
    if (!entry) return;
    navigator.clipboard.writeText(entry.code).then(() => {
      const btn = document.querySelector(`.codeblock[data-id="${id}"] .copy-btn`);
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  };

  // Bubble already has final rendered HTML (tags intact) — hum sirf text nodes ko
  // khaali karke, order mein thoda-thoda reveal karte hain. Isse tags kabhi beech
  // mein toot-te nahi (jaise markdown ka `**` ya code block).
  function typewriterReveal(bubble, onDone) {
    const walker = document.createTreeWalker(bubble, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) {
      nodes.push({ node: n, full: n.textContent });
      n.textContent = '';
    }
    if (!nodes.length) { if (onDone) onDone(); return; }

    bubble.classList.add('typing');
    const CHARS_PER_TICK = 2;
    const TICK_MS = 14;
    let ni = 0, ci = 0;

    function step() {
      if (ni >= nodes.length) {
        bubble.classList.remove('typing');
        if (onDone) onDone();
        return;
      }
      const entry = nodes[ni];
      ci += CHARS_PER_TICK;
      if (ci >= entry.full.length) {
        entry.node.textContent = entry.full;
        ni++;
        ci = 0;
      } else {
        entry.node.textContent = entry.full.slice(0, ci);
      }
      scrollBottom();
      setTimeout(step, TICK_MS);
    }
    step();
  }

  // ── Action Registry (frontend) ─────────────────────────────────────
  // Backend jab bhi [ACTION:name]{...} bhejta hai, uska matching handler yahan
  // se milta hai. Naya action-type add karna ho toh bas ek naya key daal do.
  const ACTION_HANDLERS = {
    ask_user: renderAskUser,
  };

  function renderAction(action, wrap) {
    if (!action || !action.name) return;
    const handler = ACTION_HANDLERS[action.name];
    if (handler) handler(action.payload || {}, wrap);
  }

  function renderAskUser(payload, wrap) {
    const { type, question, options } = payload;
    if (!question || !Array.isArray(options) || !options.length) return;

    const box = document.createElement('div');
    box.className = 'ask-user';

    const q = document.createElement('div');
    q.className = 'ask-user-q';
    q.textContent = question;
    box.appendChild(q);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'ask-user-opts';
    box.appendChild(optsWrap);

    if (type === 'multi') {
      const selected = new Set();
      const confirmBtn = document.createElement('button');
      confirmBtn.type = 'button';
      confirmBtn.className = 'ask-user-confirm';
      confirmBtn.textContent = 'Confirm';
      confirmBtn.disabled = true;

      options.slice(0, 4).forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ask-user-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          if (selected.has(opt)) {
            selected.delete(opt);
            btn.classList.remove('selected');
          } else {
            selected.add(opt);
            btn.classList.add('selected');
          }
          confirmBtn.disabled = selected.size === 0;
        });
        optsWrap.appendChild(btn);
      });

      confirmBtn.addEventListener('click', () => {
        const answer = Array.from(selected).join(', ');
        box.remove();
        if (!busy && answer) send(answer);
      });
      box.appendChild(confirmBtn);
    } else {
      options.slice(0, 4).forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ask-user-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          box.remove();
          if (!busy) send(opt);
        });
        optsWrap.appendChild(btn);
      });
    }

    wrap.appendChild(box);
    scrollBottom();
  }

  function addAssistantBubble(text, meta, isError, animate, action) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' err' : '');
    if (isError) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = renderMarkdown(text);
    }
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    $main.appendChild(row);

    function attachMeta() {
      if (meta) {
        const metaEl = document.createElement('div');
        metaEl.className = 'meta';
        metaEl.textContent = meta;
        wrap.appendChild(metaEl);
      }
      if (action) renderAction(action, wrap);
      scrollBottom();
    }

    if (!isError && animate) {
      // meta (provider · model) sirf typing khatam hone ke baad dikhta hai
      typewriterReveal(bubble, attachMeta);
    } else {
      attachMeta();
    }
    scrollBottom();
  }

  function lightDot(providerName) {
    $dots.forEach(d => d.classList.toggle('live', d.dataset.provider === providerName));
  }

  async function send(text) {
    history.push({ role: 'user', content: text });
    addUserBubble(text);
    $input.value = '';
    $input.style.height = 'auto';

    busy = true;
    $send.disabled = true;
    const thinkingRow = addThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: history.map(m => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await res.json();
      thinkingRow.remove();

      if (!res.ok) {
        lightDot(null);
        let errText = data.error || 'Kuch gadbad ho gayi.';
        if (Array.isArray(data.details) && data.details.length) {
          errText += '\n\n— Details —\n' + data.details.join('\n');
        }
        addAssistantBubble(errText, null, true);
        return;
      }

      history.push({ role: 'assistant', content: data.reply, provider: data.provider, model: data.model });
      persistTurn(); // pehla successful reply aate hi session (agar naya hai) auto-ban jaata hai
      lightDot(data.provider);
      addAssistantBubble(data.reply, `${data.provider} · ${data.model || ''}`, false, true, data.action);
    } catch (err) {
      thinkingRow.remove();
      lightDot(null);
      addAssistantBubble('Network error — connection check kar.', null, true);
    } finally {
      busy = false;
      $send.disabled = false;
      $input.focus();
    }
  }

  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $input.value.trim();
    if (!text || busy) return;
    send(text);
  });
</script>
</body>
