<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Chaman AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12100e;
    --ink-2:#1a1713;
    --ink-3:#221e18;
    --line:#332d24;
    --paper:#ede7dd;
    --paper-dim:#a89d8a;
    --amber:#e8a33d;
    --amber-dim:#8a6a30;
    --sage:#7c9473;
    --sage-dim:#3a4235;
    --rust:#b24c2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(232,163,61,0.07), transparent),
      radial-gradient(ellipse 600px 400px at 100% 10%, rgba(124,148,115,0.06), transparent);
    color:var(--paper);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh; /* mobile chrome address-bar ke saath sahi height */
    overflow:hidden;
  }

  /* ── header ── */
  header{
    flex:0 0 auto;
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--ink-2), transparent);
  }
  .brand{display:flex;align-items:baseline;gap:9px;}
  .brand .glyph{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--amber);
    letter-spacing:-0.02em;
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:0.02em;
  }
  .chain{display:flex;gap:6px;align-items:center;}
  .chain .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--line);
    transition:background .3s, box-shadow .3s;
  }
  .chain .dot.live{
    background:var(--amber);
    box-shadow:0 0 8px rgba(232,163,61,0.7);
  }
  .chain .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--paper-dim);
    margin-left:4px;
    min-width:64px;
    text-align:right;
  }

  /* ── chat area ── */
  main{
    flex:1 1 auto;
    min-height:0; /* CRITICAL: without this, flex item won't shrink and pushes the form off-screen */
    overflow-y:auto;
    padding:22px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  main::-webkit-scrollbar{width:0;}

  .empty{
    margin:auto;
    text-align:center;
    color:var(--paper-dim);
    max-width:280px;
  }
  .empty .glyph-big{
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    color:var(--amber-dim);
    margin-bottom:8px;
  }
  .empty p{font-size:13px;line-height:1.6;margin:0;}

  .row{display:flex;max-width:100%;}
  .row.user{justify-content:flex-end;}
  .row.assistant{justify-content:flex-start;}

  .bubble{
    max-width:82%;
    padding:11px 14px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--sage-dim);
    border:1px solid rgba(124,148,115,0.35);
    color:#dfe8db;
    border-radius:14px 14px 3px 14px;
  }
  .row.assistant .bubble{
    background:transparent;
    border-left:2px solid var(--amber-dim);
    padding-left:13px;
    color:var(--paper);
    border-radius:2px;
  }
  .bubble strong{color:var(--amber);font-weight:600;}
  .bubble em{font-style:italic;color:#f3ead8;}
  .bubble .inline-code{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.88em;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
    color:#f0c988;
  }
  .codeblock{
    margin:8px 0;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--ink-3);
  }
  .codeblock-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 10px;
    background:var(--ink-2);
    border-bottom:1px solid var(--line);
  }
  .codeblock-head .lang{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--paper-dim);
    text-transform:lowercase;
    letter-spacing:0.03em;
  }
  .copy-btn{
    all:unset;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:5px;
    padding:3px 9px;
    cursor:pointer;
    line-height:1;
  }
  .copy-btn:active{transform:scale(0.94);}
  .copy-btn.copied{color:var(--sage);border-color:var(--sage-dim);}
  .codeblock pre{
    margin:0;
    padding:10px 12px;
    overflow-x:auto;
  }
  .codeblock code{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    line-height:1.5;
    color:#e6ddc9;
    white-space:pre;
  }
  .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--paper-dim);
    margin-top:5px;
    padding-left:13px;
  }
  .row.assistant .wrap{display:flex;flex-direction:column;max-width:82%;}

  .thinking{
    display:flex;gap:4px;padding-left:13px;border-left:2px solid var(--amber-dim);
  }
  .thinking span{
    width:5px;height:5px;border-radius:50%;background:var(--amber-dim);
    animation:pulse 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){animation-delay:.15s;}
  .thinking span:nth-child(3){animation-delay:.3s;}
  @keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.85);}40%{opacity:1;transform:scale(1);}}

  .err{color:var(--rust);}

  /* ── input bar ── */
  form{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:var(--ink-2);
    border-top:1px solid var(--line);
  }
  .prompt-prefix{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--amber-dim);
    white-space:nowrap;
    user-select:none;
  }
  textarea{
    flex:1;
    resize:none;
    background:var(--ink-3);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--paper);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:15px;
    padding:11px 12px;
    max-height:110px;
    line-height:1.4;
  }
  textarea:focus{outline:none;border-color:var(--amber-dim);}
  textarea::placeholder{color:var(--paper-dim);}

  button{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:10px;
    border:1px solid var(--amber-dim);
    background:var(--amber);
    color:var(--ink);
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  button:disabled{opacity:.4;cursor:not-allowed;}
  button:active:not(:disabled){transform:scale(0.94);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="glyph">Chaman AI</span>
  </div>
  <div class="chain" id="chain">
    <div class="dot" data-provider="Groq"></div>
    <div class="dot" data-provider="OpenRouter"></div>
    <div class="dot" data-provider="Cerebras"></div>
    <div class="dot" data-provider="Mistral"></div>
    <span class="label" id="chainLabel">ready</span>
  </div>
</header>

<main id="main">
  <div class="empty" id="empty">
    <div class="glyph-big">⟡</div>
  </div>
</main>

<form id="form">
  <span class="prompt-prefix">&gt;</span>
  <textarea id="input" rows="1" placeholder="Type kar..." autocomplete="off"></textarea>
  <button id="send" type="submit">↑</button>
</form>

<script>
  const $main = document.getElementById('main');
  const $empty = document.getElementById('empty');
  const $form = document.getElementById('form');
  const $input = document.getElementById('input');
  const $send = document.getElementById('send');
  const $chainLabel = document.getElementById('chainLabel');
  const $dots = document.querySelectorAll('.chain .dot');

  let history = []; // {role, content} — in-memory only, resets on reload
  let busy = false;

  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 110) + 'px';
  });

  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $form.requestSubmit();
    }
  });

  function scrollBottom() {
    $main.scrollTop = $main.scrollHeight;
  }

  function addUserBubble(text) {
    $empty.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    $main.appendChild(row);
    scrollBottom();
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'thinkingRow';
    row.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div>`;
    $main.appendChild(row);
    scrollBottom();
    return row;
  }

  // ── chhota markdown renderer: **bold**, *italic*, `inline code`, ```code blocks``` ──
  let cbCounter = 0;
  const codeStore = {}; // id -> raw code text (copy button ke liye, escaped HTML se alag rakha)

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderMarkdown(raw) {
    // step 1: fenced code blocks nikaal ke placeholder daal do (raw text par, escape se pehle)
    let text = raw.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
      const id = 'cb' + (cbCounter++);
      codeStore[id] = { lang: lang || '', code: code.replace(/\n$/, '') };
      return `\u0000${id}\u0000`;
    });

    // step 2: baaki sab escape karo (XSS-safe)
    text = escapeHtml(text);

    // step 3: inline formatting
    text = text.replace(/`([^`\n]+)`/g, (_, c) => `<code class="inline-code">${c}</code>`);
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');

    // step 4: code block placeholders ko asli block se replace karo
    text = text.replace(/\u0000(cb\d+)\u0000/g, (_, id) => {
      const { lang, code } = codeStore[id];
      return `<div class="codeblock" data-id="${id}">
        <div class="codeblock-head">
          <span class="lang">${escapeHtml(lang || 'text')}</span>
          <button type="button" class="copy-btn" onclick="copyCode('${id}')">Copy</button>
        </div>
        <pre><code>${escapeHtml(code)}</code></pre>
      </div>`;
    });

    return text;
  }

  window.copyCode = function (id) {
    const entry = codeStore[id];
    if (!entry) return;
    navigator.clipboard.writeText(entry.code).then(() => {
      const btn = document.querySelector(`.codeblock[data-id="${id}"] .copy-btn`);
      if (!btn) return;
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  };

  function addAssistantBubble(text, meta, isError) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' err' : '');
    if (isError) {
      bubble.textContent = text;
    } else {
      bubble.innerHTML = renderMarkdown(text);
    }
    wrap.appendChild(bubble);
    if (meta) {
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      metaEl.textContent = meta;
      wrap.appendChild(metaEl);
    }
    row.appendChild(wrap);
    $main.appendChild(row);
    scrollBottom();
  }

  function lightDot(providerName) {
    $dots.forEach(d => d.classList.toggle('live', d.dataset.provider === providerName));
    $chainLabel.textContent = providerName || 'ready';
  }

  async function send(text) {
    history.push({ role: 'user', content: text });
    addUserBubble(text);
    $input.value = '';
    $input.style.height = 'auto';

    busy = true;
    $send.disabled = true;
    $chainLabel.textContent = 'sochte hue...';
    const thinkingRow = addThinking();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      thinkingRow.remove();

      if (!res.ok) {
        lightDot(null);
        addAssistantBubble(data.error || 'Kuch gadbad ho gayi.', null, true);
        return;
      }

      history.push({ role: 'assistant', content: data.reply });
      lightDot(data.provider);
      addAssistantBubble(data.reply, `${data.provider} · ${data.model || ''}`);
    } catch (err) {
      thinkingRow.remove();
      lightDot(null);
      addAssistantBubble('Network error — connection check kar.', null, true);
    } finally {
      busy = false;
      $send.disabled = false;
      $input.focus();
    }
  }

  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = $input.value.trim();
    if (!text || busy) return;
    send(text);
  });
</script>
</body>
</html>
